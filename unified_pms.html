<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sobha Modular PMS</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
  /* ── Design tokens (matching existing Assembly PMS) ── */
  :root {
    --navy:       #1a1a2e;
    --charcoal:   #2c2c3e;
    --gold:       #d4af37;
    --dark-gold:  #b8941f;
    --light-gold: #f4e5c2;
    --bronze:     #cd7f32;
    --cream:      #fafaf8;
    --white:      #ffffff;
    --slate:      #708090;
    --success:    #2e7d32;
    --danger:     #c62828;
    --warning:    #e65100;
    --info:       #1565c0;
    --radius:     10px;
    --shadow:     0 4px 20px rgba(0,0,0,0.12);
    --shadow-lg:  0 8px 40px rgba(0,0,0,0.18);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: linear-gradient(135deg, var(--charcoal) 0%, var(--navy) 60%, #1a1a2e 100%);
    min-height: 100vh;
    color: var(--navy);
  }

  /* ── Screens ── */
  .screen { display: none; min-height: 100vh; }
  .screen.active { display: flex; flex-direction: column; }

  /* ─────────────────────────────────────────────
     LOGIN SCREEN
  ───────────────────────────────────────────── */
  #screen-login {
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .login-card {
    background: var(--white);
    border-radius: 16px;
    box-shadow: var(--shadow-lg);
    width: 100%;
    max-width: 400px;
    overflow: hidden;
  }

  .login-header {
    background: linear-gradient(135deg, var(--charcoal), var(--navy));
    padding: 32px 32px 24px;
    text-align: center;
    border-bottom: 3px solid var(--gold);
  }

  .login-logo {
    width: 80px;
    height: 80px;
    object-fit: contain;
    background: rgba(255,255,255,0.95);
    border-radius: 12px;
    padding: 8px;
    margin-bottom: 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.3);
  }

  .login-title {
    color: var(--white);
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }

  .login-subtitle {
    color: var(--light-gold);
    font-size: 12px;
    margin-top: 4px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .login-body {
    padding: 32px;
  }

  .form-group {
    margin-bottom: 18px;
  }

  .form-label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--slate);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 7px;
  }

  .form-input {
    width: 100%;
    padding: 11px 14px;
    border: 1.5px solid #e0e0e0;
    border-radius: var(--radius);
    font-size: 15px;
    font-family: inherit;
    color: var(--navy);
    transition: border-color 0.2s, box-shadow 0.2s;
    outline: none;
    background: var(--cream);
  }

  .form-input:focus {
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(212,175,55,0.15);
    background: var(--white);
  }

  .btn-login {
    width: 100%;
    padding: 13px;
    background: linear-gradient(135deg, var(--gold), var(--dark-gold));
    color: var(--navy);
    border: none;
    border-radius: var(--radius);
    font-size: 15px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    letter-spacing: 0.5px;
    transition: opacity 0.2s, transform 0.1s;
    margin-top: 6px;
  }

  .btn-login:hover { opacity: 0.92; }
  .btn-login:active { transform: scale(0.99); }
  .btn-login:disabled { opacity: 0.55; cursor: not-allowed; }

  .login-error {
    background: #fdecea;
    color: var(--danger);
    border: 1px solid #f5c6c6;
    border-radius: var(--radius);
    padding: 10px 14px;
    font-size: 13px;
    margin-top: 14px;
    display: none;
  }

  .login-footer {
    text-align: center;
    padding: 0 32px 24px;
    font-size: 11px;
    color: var(--slate);
  }

  /* ─────────────────────────────────────────────
     APP SHELL (post-login)
  ───────────────────────────────────────────── */
  #screen-app {
    background: var(--cream);
    min-height: 100vh;
  }

  /* Top Navigation Bar */
  .topbar {
    background: linear-gradient(135deg, var(--charcoal), var(--navy));
    border-bottom: 2px solid var(--gold);
    padding: 0 20px;
    display: flex;
    align-items: center;
    gap: 16px;
    height: 60px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 12px rgba(0,0,0,0.25);
  }

  .topbar-logo {
    width: 36px;
    height: 36px;
    object-fit: contain;
    background: rgba(255,255,255,0.92);
    border-radius: 7px;
    padding: 4px;
  }

  .topbar-brand {
    color: var(--white);
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.3px;
    flex: 1;
  }

  .topbar-brand span {
    color: var(--gold);
  }

  .topbar-user {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .user-badge {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(212,175,55,0.4);
    border-radius: 20px;
    padding: 5px 12px;
    color: var(--light-gold);
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .btn-logout {
    background: rgba(198,40,40,0.2);
    border: 1px solid rgba(198,40,40,0.4);
    color: #ef9a9a;
    border-radius: 7px;
    padding: 6px 12px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
    font-family: inherit;
  }

  .btn-logout:hover { background: rgba(198,40,40,0.35); }

  /* App Content */
  .app-content {
    padding: 28px 32px;
    max-width: 1400px;
    margin: 0 auto;
    width: 100%;
  }

  /* ─────────────────────────────────────────────
     HOME / MODULE TILES
  ───────────────────────────────────────────── */
  .home-greeting {
    margin-bottom: 28px;
  }

  .home-greeting h1 {
    font-size: 26px;
    font-weight: 700;
    color: var(--navy);
  }

  .home-greeting p {
    color: var(--slate);
    font-size: 14px;
    margin-top: 4px;
  }

  .modules-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
  }

  @media (max-width: 900px) {
    .modules-grid { grid-template-columns: repeat(2, 1fr); }
  }

  @media (max-width: 560px) {
    .modules-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  }

  .module-card {
    background: var(--white);
    border-radius: 14px;
    padding: 24px 20px;
    border: 2px solid var(--light-gold);
    cursor: pointer;
    transition: border-color 0.2s, box-shadow 0.2s, transform 0.15s;
    position: relative;
    overflow: hidden;
  }

  .module-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--gold), var(--bronze));
    opacity: 0;
    transition: opacity 0.2s;
  }

  .module-card:hover {
    border-color: var(--gold);
    box-shadow: var(--shadow);
    transform: translateY(-2px);
  }

  .module-card:hover::before { opacity: 1; }

  .module-icon {
    font-size: 32px;
    margin-bottom: 12px;
    display: block;
  }

  .module-name {
    font-size: 16px;
    font-weight: 700;
    color: var(--navy);
    margin-bottom: 6px;
  }

  .module-desc {
    font-size: 12px;
    color: var(--slate);
    line-height: 1.5;
  }

  .module-tag {
    display: inline-block;
    margin-top: 12px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 20px;
  }

  .tag-assembly { background: #e8f5e9; color: #2e7d32; }
  .tag-machine  { background: #e3f2fd; color: #1565c0; }
  .tag-shared   { background: #fef9e7; color: #7d6608; }
  .tag-admin    { background: #fce4ec; color: #880e4f; }

  /* ─────────────────────────────────────────────
     ADMIN PANEL
  ───────────────────────────────────────────── */
  .panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
    flex-wrap: wrap;
    gap: 12px;
  }

  .panel-title {
    font-size: 22px;
    font-weight: 700;
    color: var(--navy);
  }

  .panel-title span { color: var(--gold); }

  .btn {
    padding: 10px 18px;
    border-radius: var(--radius);
    font-size: 13px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    border: none;
    transition: opacity 0.2s, transform 0.1s;
  }

  .btn:active { transform: scale(0.98); }
  .btn-primary { background: linear-gradient(135deg, var(--gold), var(--dark-gold)); color: var(--navy); }
  .btn-secondary { background: var(--navy); color: var(--white); }
  .btn-danger { background: var(--danger); color: var(--white); }
  .btn-ghost { background: transparent; color: var(--navy); border: 1.5px solid #ddd; }
  .btn-sm { padding: 6px 12px; font-size: 12px; }
  .btn:hover { opacity: 0.88; }

  /* User Table */
  .card {
    background: var(--white);
    border-radius: 14px;
    border: 1px solid var(--light-gold);
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  .card-header {
    padding: 16px 20px;
    background: linear-gradient(135deg, var(--charcoal), var(--navy));
    color: var(--white);
    font-size: 14px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 2px solid var(--gold);
  }

  .table-wrap { overflow-x: auto; }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }

  th {
    background: #f5f5f5;
    padding: 10px 14px;
    text-align: left;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.7px;
    color: var(--slate);
    border-bottom: 1px solid #e8e8e8;
  }

  td {
    padding: 12px 14px;
    border-bottom: 1px solid #f0f0f0;
    color: var(--navy);
    vertical-align: middle;
  }

  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #fafaf8; }

  .action-badges {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }

  .action-badge {
    font-size: 10px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 10px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }

  .ab-plan     { background: #e8f5e9; color: #1b5e20; }
  .ab-machine  { background: #e3f2fd; color: #0d47a1; }
  .ab-material { background: #fff3e0; color: #e65100; }
  .ab-approve  { background: #f3e5f5; color: #4a148c; }
  .ab-monitor  { background: #e0f7fa; color: #006064; }
  .ab-view     { background: #f1f8e9; color: #33691e; }
  .ab-dashboard{ background: #fef9e7; color: #7d6608; }

  .status-active   { color: var(--success); font-weight: 700; }
  .status-inactive { color: var(--slate); }

  /* User Modal */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    z-index: 500;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .modal-overlay.open { display: flex; }

  .modal {
    background: var(--white);
    border-radius: 16px;
    width: 100%;
    max-width: 520px;
    box-shadow: var(--shadow-lg);
    overflow: hidden;
    animation: modalIn 0.2s ease;
  }

  @keyframes modalIn {
    from { opacity: 0; transform: translateY(-16px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .modal-header {
    background: linear-gradient(135deg, var(--charcoal), var(--navy));
    border-bottom: 2px solid var(--gold);
    padding: 18px 22px;
    color: var(--white);
    font-size: 16px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .modal-close {
    background: none;
    border: none;
    color: var(--light-gold);
    font-size: 20px;
    cursor: pointer;
    line-height: 1;
  }

  .modal-body { padding: 22px; }

  .modal-footer {
    padding: 14px 22px;
    background: #f9f9f9;
    border-top: 1px solid #eee;
    display: flex;
    gap: 10px;
    justify-content: flex-end;
  }

  /* Actions checkboxes */
  .actions-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-top: 6px;
  }

  .action-check {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 8px 10px;
    border: 1.5px solid #e0e0e0;
    border-radius: 8px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    font-size: 12px;
    font-weight: 600;
    color: var(--navy);
    user-select: none;
  }

  .action-check input { display: none; }

  .action-check.checked {
    border-color: var(--gold);
    background: linear-gradient(135deg, #fffef0, var(--light-gold));
  }

  .check-dot {
    width: 14px;
    height: 14px;
    border: 2px solid #ccc;
    border-radius: 4px;
    flex-shrink: 0;
    transition: background 0.15s, border-color 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .action-check.checked .check-dot {
    background: var(--gold);
    border-color: var(--dark-gold);
  }

  .check-dot::after {
    content: '✓';
    font-size: 9px;
    color: var(--navy);
    display: none;
    font-weight: 900;
  }

  .action-check.checked .check-dot::after { display: block; }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--navy);
    color: var(--white);
    padding: 12px 18px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 600;
    border-left: 4px solid var(--gold);
    box-shadow: var(--shadow-lg);
    z-index: 9999;
    display: none;
    animation: slideUp 0.25s ease;
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .toast.success { border-left-color: #4caf50; }
  .toast.error   { border-left-color: var(--danger); }

  /* Empty state */
  .empty-state {
    text-align: center;
    padding: 48px 20px;
    color: var(--slate);
  }

  .empty-state .empty-icon { font-size: 48px; margin-bottom: 12px; }
  .empty-state p { font-size: 14px; }

  /* Back button */
  .btn-back {
    background: none;
    border: none;
    color: var(--slate);
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 20px;
    padding: 0;
    font-weight: 600;
    transition: color 0.2s;
  }

  .btn-back:hover { color: var(--navy); }

  /* Loading spinner */
  .spinner {
    width: 36px; height: 36px;
    border: 3px solid var(--light-gold);
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin: 60px auto;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* Placeholder module screens */
  .placeholder-screen {
    text-align: center;
    padding: 80px 20px;
  }

  .placeholder-icon { font-size: 64px; margin-bottom: 20px; }

  .placeholder-screen h2 {
    font-size: 24px;
    font-weight: 700;
    color: var(--navy);
    margin-bottom: 10px;
  }

  .placeholder-screen p {
    color: var(--slate);
    font-size: 14px;
    max-width: 360px;
    margin: 0 auto;
    line-height: 1.6;
  }

  .coming-soon-badge {
    display: inline-block;
    margin-top: 20px;
    background: var(--light-gold);
    color: var(--navy);
    font-size: 11px;
    font-weight: 700;
    padding: 5px 14px;
    border-radius: 20px;
    letter-spacing: 1px;
    text-transform: uppercase;
    border: 1px solid var(--gold);
  }

  /* Dashboard summary cards */
  .summary-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 24px;
  }

  .summary-card {
    background: var(--white);
    border-radius: 12px;
    padding: 20px 22px;
    border: 1px solid var(--light-gold);
    box-shadow: var(--shadow);
    position: relative;
    overflow: hidden;
  }

  .summary-card::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--gold), var(--bronze));
  }

  .summary-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--slate);
    margin-bottom: 10px;
  }

  .summary-value {
    font-size: 36px;
    font-weight: 800;
    color: var(--navy);
    line-height: 1;
  }

  .summary-sub {
    font-size: 11px;
    color: var(--slate);
    margin-top: 6px;
  }

  .summary-card.gold  .summary-value { color: var(--dark-gold); }
  .summary-card.green .summary-value { color: var(--success); }
  .summary-card.red   .summary-value { color: var(--danger); }

  /* Dashboard two-column layout */
  .dash-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 20px;
  }

  .dash-full { grid-column: 1 / -1; }

  /* Line breakdown table */
  .eff-bar-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .eff-bar-bg {
    flex: 1;
    height: 8px;
    background: #eee;
    border-radius: 4px;
    overflow: hidden;
  }

  .eff-bar-fill {
    height: 100%;
    border-radius: 4px;
    transition: width 0.4s ease;
  }

  .eff-val {
    font-size: 12px;
    font-weight: 700;
    min-width: 38px;
    text-align: right;
  }

  /* Password reset modal */
  .pwd-modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    z-index: 600;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .pwd-modal-overlay.open { display: flex; }

  /* Responsive */
  @media (max-width: 600px) {
    .app-content { padding: 16px; }
    .modules-grid { grid-template-columns: 1fr 1fr; gap: 12px; }
    .module-card { padding: 16px 14px; }
    .module-icon { font-size: 24px; }
    .module-name { font-size: 13px; }
    .module-desc { display: none; }
    .actions-grid { grid-template-columns: repeat(2, 1fr); }
    .topbar-brand { font-size: 13px; }
  }
  /* ─────────────────────────────────────────────
     MACHINE PMS — Orders & Planning + Run
  ───────────────────────────────────────────── */
  .mch-tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 20px;
    background: var(--white);
    border-radius: 10px;
    padding: 4px;
    border: 1px solid var(--light-gold);
    width: fit-content;
  }

  .mch-tab {
    padding: 8px 18px;
    border: none;
    border-radius: 7px;
    font-size: 13px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    color: var(--slate);
    background: transparent;
    transition: all 0.15s;
    position: relative;
  }

  .mch-tab.active {
    background: linear-gradient(135deg, var(--gold), var(--dark-gold));
    color: var(--navy);
  }

  .mch-tab .tbadge {
    position: absolute;
    top: -4px;
    right: -4px;
    background: var(--danger);
    color: white;
    font-size: 10px;
    font-weight: 700;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Order cards */
  .mo-card {
    background: var(--white);
    border: 1.5px solid var(--light-gold);
    border-radius: 12px;
    padding: 16px 18px;
    margin-bottom: 12px;
    cursor: pointer;
    transition: border-color 0.15s, box-shadow 0.15s;
  }

  .mo-card:hover { border-color: var(--gold); box-shadow: var(--shadow); }
  .mo-card.urgent { border-color: #f59e0b; border-left: 4px solid #f59e0b; }

  .mo-hdr {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
    flex-wrap: wrap;
    gap: 6px;
  }

  .mo-cl { font-size: 16px; font-weight: 800; color: var(--info); }
  .mo-project { font-size: 12px; color: var(--slate); margin-top: 2px; }

  .mo-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 8px;
    font-size: 12px;
    color: var(--slate);
  }

  .mo-meta span {
    background: #f5f5f5;
    padding: 3px 8px;
    border-radius: 6px;
  }

  /* Progress bar */
  .prog-bar {
    height: 6px;
    background: #e5e7eb;
    border-radius: 3px;
    overflow: hidden;
    margin-top: 10px;
  }

  .prog-fill { height: 100%; border-radius: 3px; transition: width 0.3s; }
  .pf-blue   { background: var(--info); }
  .pf-green  { background: var(--success); }
  .pf-amber  { background: #f59e0b; }

  /* Status badges */
  .sbadge {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 10px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }

  .sb-draft     { background: #f3f4f6; color: #6b7280; }
  .sb-released  { background: #dbeafe; color: #1d4ed8; }
  .sb-progress  { background: #fef3c7; color: #92400e; }
  .sb-wip       { background: #d1fae5; color: #065f46; }
  .sb-ready     { background: #d1fae5; color: #065f46; }
  .sb-sent      { background: #dbeafe; color: #1d4ed8; }
  .sb-complete  { background: #d1fae5; color: #065f46; }
  .sb-pending   { background: #fde68a; color: #92400e; }
  .sb-approved  { background: #d1fae5; color: #065f46; }
  .sb-rejected  { background: #fee2e2; color: #991b1b; }
  .sb-running   { background: #d1fae5; color: #065f46; }
  .sb-paused    { background: #ede9fe; color: #5b21b6; }
  .sb-urgent    { background: #fef3c7; color: #92400e; }

  /* Sub-order planning rows */
  .sub-row {
    display: grid;
    grid-template-columns: 1fr 80px 140px 130px 60px auto auto;
    gap: 8px;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid #f3f4f6;
    font-size: 13px;
  }

  .sub-row:last-child { border-bottom: none; }

  .sub-row input, .sub-row select {
    padding: 6px 8px;
    border: 1.5px solid #e0e0e0;
    border-radius: 7px;
    font-size: 12px;
    font-family: inherit;
    width: 100%;
  }

  .sub-row input:focus, .sub-row select:focus {
    border-color: var(--gold);
    outline: none;
  }

  /* Run screen */
  .run-job-card {
    background: var(--white);
    border: 2px solid var(--light-gold);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: border-color 0.15s, box-shadow 0.15s;
  }

  .run-job-card:hover { border-color: var(--gold); box-shadow: var(--shadow); }
  .run-job-card.urgent { border-color: #f59e0b; }

  .run-counter {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    margin: 20px 0;
  }

  .counter-box {
    text-align: center;
  }

  .counter-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--slate);
    margin-bottom: 6px;
  }

  .counter-val {
    font-size: 56px;
    font-weight: 800;
    line-height: 1;
  }

  .counter-val.done  { color: var(--success); }
  .counter-val.rej   { color: var(--danger); }

  .counter-btns {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-top: 8px;
  }

  .c-btn {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 2px solid;
    font-size: 20px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    transition: opacity 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .c-btn:hover { opacity: 0.8; }
  .c-btn.plus  { border-color: var(--success); color: var(--success); background: #e8f5e9; }
  .c-btn.minus { border-color: var(--danger);  color: var(--danger);  background: #fdecea; }

  .run-timer-display {
    font-size: 36px;
    font-weight: 800;
    color: var(--navy);
    text-align: center;
    font-variant-numeric: tabular-nums;
    margin: 8px 0;
  }

  /* Settings form */
  .settings-section {
    background: var(--white);
    border-radius: 12px;
    border: 1px solid var(--light-gold);
    padding: 18px 20px;
    margin-bottom: 16px;
  }

  .settings-section h3 {
    font-size: 14px;
    font-weight: 700;
    color: var(--navy);
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--light-gold);
  }

  .tag-list {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 10px;
  }

  .tag-item {
    background: var(--light-gold);
    color: var(--navy);
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .tag-remove {
    cursor: pointer;
    color: var(--danger);
    font-size: 14px;
    line-height: 1;
    font-weight: 700;
  }

  .tag-add {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  /* Alert boxes */
  .al {
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13px;
    margin-bottom: 10px;
  }

  .al-info  { background: #dbeafe; color: #1e40af; }
  .al-succ  { background: #d1fae5; color: #065f46; }
  .al-warn  { background: #fef3c7; color: #92400e; }
  .al-dang  { background: #fee2e2; color: #991b1b; }

  /* Verify session card */
  .verify-card {
    background: var(--white);
    border: 1.5px solid var(--light-gold);
    border-radius: 12px;
    padding: 16px 18px;
    margin-bottom: 12px;
  }

  /* WIP card */
  .wip-card {
    background: var(--white);
    border-radius: 12px;
    padding: 16px 18px;
    margin-bottom: 12px;
    border-left: 4px solid var(--success);
    border: 1.5px solid var(--light-gold);
    border-left-width: 4px;
  }

  /* Machine card */
  .machine-card {
    background: var(--white);
    border: 1.5px solid #e5e7eb;
    border-radius: 12px;
    padding: 16px;
    transition: border-color 0.15s;
  }

  .machine-card.running  { border-color: var(--success); border-left: 4px solid var(--success); }
  .machine-card.downtime { border-color: var(--danger);  border-left: 4px solid var(--danger); }

  .mstat {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 20px;
  }

  .ms-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
  }

  .ms-run  { background: #d1fae5; color: #065f46; }
  .ms-run .ms-dot  { background: var(--success); }
  .ms-idle { background: #f3f4f6; color: #6b7280; }
  .ms-idle .ms-dot { background: #9ca3af; }
  .ms-dt   { background: #fee2e2; color: #991b1b; }
  .ms-dt .ms-dot   { background: var(--danger); }

  /* Metrics grid */
  .metrics-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 16px;
  }

  .metric-box {
    background: var(--white);
    border: 1px solid var(--light-gold);
    border-radius: 10px;
    padding: 14px;
    text-align: center;
  }

  .metric-box .lbl { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; color: var(--slate); margin-bottom: 6px; }
  .metric-box .val { font-size: 28px; font-weight: 800; color: var(--navy); line-height: 1; }
  .metric-box .sub { font-size: 11px; color: var(--slate); margin-top: 4px; }

  @media (max-width: 768px) {
    .sub-row { grid-template-columns: 1fr 70px; }
    .sub-row > *:nth-child(n+3) { grid-column: 1; }
    .metrics-row { grid-template-columns: repeat(2, 1fr); }
    .run-counter { flex-direction: column; gap: 12px; }
  }
</style>
</head>

<div class="modal-overlay" id="user-modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <span id="modal-title">Create User</span>
      <button class="modal-close" onclick="closeUserModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">User ID</label>
        <input class="form-input" id="modal-uid" type="text" placeholder="e.g. RAK001" autocapitalize="none">
        <div style="font-size:11px;color:var(--slate);margin-top:4px;">Uppercase letters and numbers only. Cannot be changed after creation.</div>
      </div>
      <div class="form-group" id="modal-pwd-group">
        <label class="form-label">Password</label>
        <input class="form-input" id="modal-pwd" type="password" placeholder="Minimum 6 characters">
      </div>
      <div class="form-group">
        <label class="form-label">Display Name</label>
        <input class="form-input" id="modal-name" type="text" placeholder="e.g. Rakesh Kumar">
      </div>
      <div class="form-group">
        <label class="form-label">Permissions</label>
        <div class="actions-grid" id="actions-grid">
          <!-- rendered by JS -->
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost btn-sm" onclick="closeUserModal()">Cancel</button>
      <button class="btn btn-primary btn-sm" id="modal-save-btn" onclick="saveUser()">Save User</button>
    </div>
  </div>
</div>

//  AUTH STATE
// ═══════════════════════════════════════════════════════════
auth.onAuthStateChanged(async (user) => {
  if (user) {
    currentUser = user;
    try {
      const snap = await db.ref(`users/${user.uid}`).once('value');
      currentProfile = snap.val();

      if (!currentProfile) {
        // Auth account exists but no profile — treat as invalid
        await auth.signOut();
        showLogin();
        showError('Account not configured. Contact admin.');
        return;
      }

      // Update last login timestamp
      await db.ref(`users/${user.uid}/lastLogin`).set(
        new Date().toISOString()
      );

      showApp();
    } catch (e) {
      console.error(e);
      showLogin();
    }
  } else {
    currentUser  = null;
    currentProfile = null;
    showLogin();
  }
});

// ═══════════════════════════════════════════════════════════
//  SCREEN HELPERS
// ═══════════════════════════════════════════════════════════
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function showLogin() { showScreen('screen-login'); }

function showApp() {
  showScreen('screen-app');
  const uid = currentProfile?.userId || currentUser?.email?.split('@')[0]?.toUpperCase() || '—';
  document.getElementById('topbar-username').textContent = uid;
  renderHome();
}

// ═══════════════════════════════════════════════════════════
//  LOGIN
// ═══════════════════════════════════════════════════════════
function doLogin() {
  const rawId = document.getElementById('inp-username').value.trim();
  const pwd   = document.getElementById('inp-password').value;

  if (!rawId || !pwd) { showError('Please enter your User ID and password.'); return; }

  const email = rawId.toLowerCase() + EMAIL_DOMAIN;
  const btn   = document.getElementById('btn-login');
  btn.disabled = true;
  btn.textContent = 'Signing in…';
  clearError();

  auth.signInWithEmailAndPassword(email, pwd)
    .catch(err => {
      btn.disabled = false;
      btn.textContent = 'Sign In';
      const msg = err.code === 'auth/user-not-found' || err.code === 'auth/wrong-password' || err.code === 'auth/invalid-credential'
        ? 'Invalid User ID or password.'
        : 'Sign in failed. Please try again.';
      showError(msg);
    });
  // Success is handled by onAuthStateChanged
}

// Allow Enter key in login form
document.getElementById('inp-password').addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});
document.getElementById('inp-username').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('inp-password').focus();
});

function doLogout() {
  auth.signOut();
}

function showError(msg) {
  const el = document.getElementById('login-error');
  el.textContent = msg;
  el.style.display = 'block';
}

function clearError() {
  document.getElementById('login-error').style.display = 'none';
}

// Reset login button if auth state changes back
auth.onAuthStateChanged(u => {
  if (!u) {
    const btn = document.getElementById('btn-login');
    if (btn) { btn.disabled = false; btn.textContent = 'Sign In'; }
  }
});

// ═══════════════════════════════════════════════════════════
//  HOME — MODULE TILES
// ═══════════════════════════════════════════════════════════
function renderHome() {
  const actions  = currentProfile?.actions || {};
  const isAdmin  = currentProfile?.isAdmin === true;

  // Which modules to show
  const visible = MODULES.filter(m => isAdmin || actions[m.action]);

  const content = document.getElementById('app-content');

  const name = currentProfile?.displayName
    ? currentProfile.displayName.split(' ')[0]
    : (currentProfile?.userId || 'there');

  const greeting = getGreeting();

  let html = `
    <div class="home-greeting">
      <h1>${greeting}, ${name} 👋</h1>
      <p>${new Date().toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long', year:'numeric' })}</p>
    </div>
    <div class="modules-grid">
  `;

  if (visible.length === 0) {
    html += `
      <div class="empty-state" style="grid-column:1/-1">
        <div class="empty-icon">🔒</div>
        <p>No modules assigned to your account yet.<br>Contact your administrator.</p>
      </div>
    `;
  } else {
    visible.forEach(m => {
      html += `
        <div class="module-card" onclick="openModule('${m.id}')">
          <span class="module-icon">${m.icon}</span>
          <div class="module-name">${m.name}</div>
          <div class="module-desc">${m.desc}</div>
          <span class="module-tag tag-${m.tag}">${m.tagLabel}</span>
        </div>
      `;
    });
  }

  // Admin tile — always shown to admin users
  if (isAdmin) {
    html += `
      <div class="module-card" onclick="openModule('admin')">
        <span class="module-icon">⚙️</span>
        <div class="module-name">Admin Panel</div>
        <div class="module-desc">Manage users, permissions, and system settings</div>
        <span class="module-tag tag-admin">Admin Only</span>
      </div>
    `;
  }

  html += `</div>`;
  content.innerHTML = html;
}

function getGreeting() {
  const h = new Date().getHours();
  if (h < 12) return 'Good morning';
  if (h < 17) return 'Good afternoon';
  return 'Good evening';
}

// ═══════════════════════════════════════════════════════════
//  MODULE ROUTER
// ═══════════════════════════════════════════════════════════
function openModule(id) {
  const content = document.getElementById('app-content');
  const backBtn = `<button class="btn-back" onclick="renderHome()">← Back to Home</button>`;

  switch (id) {
    case 'admin':     renderAdmin(content, backBtn);     break;
    case 'dashboard': renderDashboard(content, backBtn); break;
    case 'plan':      renderPlan(content);             break;
    case 'machine':   renderRun(content);              break;
    case 'view':      renderViewer(content);             break;
    default:          renderPlaceholder(content, backBtn, id); break;
  }
}

  `;
}

// ═══════════════════════════════════════════════════════════
//  DASHBOARD (reads existing Assembly PMS Firebase data)
// ═══════════════════════════════════════════════════════════
async function renderDashboard(content, backBtn) {
  content.innerHTML = `${backBtn}<div class="spinner"></div>`;

  try {
    const today = new Date().toISOString().slice(0, 10);

    // Read sessions and daily reports in parallel
    const [sessSnap, repSnap] = await Promise.all([
      db.ref('sessions').once('value'),
      db.ref('daily_reports').once('value'),
    ]);

    const sessData = sessSnap.val() || {};
    const repData  = repSnap.val()  || {};

    // ── Today's active sessions ──────────────────
    let totalActual = 0, totalPlan = 0, activeLines = 0;
    const activeByLine = {};

    Object.values(sessData).forEach(s => {
      if (!s) return;
      const started = s.startTime ? new Date(s.startTime).toISOString().slice(0,10) : '';
      if (s.status === 'active') {
        activeLines++;
        totalActual += s.actualCount || 0;
        totalPlan   += s.plan || 0;
        const lineKey = `Line ${s.line || '?'}`;
        if (!activeByLine[lineKey]) {
          activeByLine[lineKey] = { actual: 0, plan: 0, boq: s.boq || '—', startTime: s.startTime };
        }
        activeByLine[lineKey].actual += s.actualCount || 0;
        activeByLine[lineKey].plan   += s.plan || 0;
      }
    });

    const overallEff = totalPlan > 0 ? Math.round((totalActual / totalPlan) * 100) : 0;

    // ── All daily reports flat ──────────────────
    const allReports = [];
    Object.values(repData).forEach(dateGroup => {
      if (!dateGroup) return;
      Object.values(dateGroup).forEach(r => { if (r) allReports.push(r); });
    });
    allReports.sort((a,b) => String(b.savedAt||'') > String(a.savedAt||'') ? 1 : -1);

    // ── Efficiency by line (last 14 days) ──────
    const cutoff = new Date();
    cutoff.setDate(cutoff.getDate() - 14);
    const lineStats = {};

    allReports.forEach(r => {
      if (!r.savedAt || new Date(r.savedAt) < cutoff) return;
      const key = `Line ${r.line || '?'}`;
      if (!lineStats[key]) lineStats[key] = { plan: 0, actual: 0, days: 0 };
      lineStats[key].plan   += r.plan   || 0;
      lineStats[key].actual += r.actual || 0;
      lineStats[key].days++;
    });

    // ── Today's summary ──────────────────
    const todayReports = allReports.filter(r =>
      r.date === today || (r.savedAt && String(r.savedAt).startsWith(today))
    );
    const todayPlan   = todayReports.reduce((s,r) => s + (r.plan||0), 0);
    const todayActual = todayReports.reduce((s,r) => s + (r.actual||0), 0);

    // ── Build HTML ──────────────────────
    // Summary cards
    const summaryHtml = `
      <div class="summary-grid">
        <div class="summary-card">
          <div class="summary-label">Active Lines</div>
          <div class="summary-value">${activeLines}</div>
          <div class="summary-sub">Shifts in progress right now</div>
        </div>
        <div class="summary-card gold">
          <div class="summary-label">Today's Actual</div>
          <div class="summary-value">${totalActual || todayActual}</div>
          <div class="summary-sub">Units produced today</div>
        </div>
        <div class="summary-card">
          <div class="summary-label">Today's Plan</div>
          <div class="summary-value">${totalPlan || todayPlan}</div>
          <div class="summary-sub">Target for today</div>
        </div>
        <div class="summary-card ${overallEff >= 85 ? 'green' : overallEff >= 70 ? '' : 'red'}">
          <div class="summary-label">Efficiency</div>
          <div class="summary-value">${overallEff}%</div>
          <div class="summary-sub">Actual vs Plan</div>
        </div>
      </div>
    `;

    // Active lines breakdown
    const activeLineRows = Object.entries(activeByLine).map(([line, d]) => {
      const eff = d.plan > 0 ? Math.round((d.actual / d.plan) * 100) : 0;
      const color = eff >= 85 ? 'var(--success)' : eff >= 70 ? 'var(--warning)' : 'var(--danger)';
      const started = d.startTime ? new Date(d.startTime).toLocaleTimeString('en-GB', {hour:'2-digit',minute:'2-digit'}) : '—';
      return `
        <tr>
          <td><strong>${line}</strong></td>
          <td>${d.boq}</td>
          <td>${started}</td>
          <td>${d.plan}</td>
          <td>${d.actual}</td>
          <td>
            <div class="eff-bar-wrap">
              <div class="eff-bar-bg">
                <div class="eff-bar-fill" style="width:${Math.min(eff,100)}%;background:${color}"></div>
              </div>
              <span class="eff-val" style="color:${color}">${eff}%</span>
            </div>
          </td>
        </tr>
      `;
    }).join('');

    // Line performance (14 days)
    const lineStatRows = Object.entries(lineStats)
      .sort((a,b) => b[1].actual - a[1].actual)
      .map(([line, d]) => {
        const eff = d.plan > 0 ? Math.round((d.actual / d.plan) * 100) : 0;
        const color = eff >= 85 ? 'var(--success)' : eff >= 70 ? 'var(--warning)' : 'var(--danger)';
        return `
          <tr>
            <td><strong>${line}</strong></td>
            <td>${d.days}</td>
            <td>${d.plan}</td>
            <td>${d.actual}</td>
            <td>
              <div class="eff-bar-wrap">
                <div class="eff-bar-bg">
                  <div class="eff-bar-fill" style="width:${Math.min(eff,100)}%;background:${color}"></div>
                </div>
                <span class="eff-val" style="color:${color}">${eff}%</span>
              </div>
            </td>
          </tr>
        `;
      }).join('');

    // Recent daily reports (last 14)
    const reportRows = allReports.slice(0, 14).map(r => {
      const eff = r.plan > 0 ? Math.round((r.actual / r.plan) * 100) : 0;
      const color = eff >= 85 ? 'var(--success)' : eff >= 70 ? 'var(--warning)' : 'var(--danger)';
      return `
        <tr>
          <td>${r.date || '—'}</td>
          <td>Line ${r.line || '—'}</td>
          <td>${r.boq || '—'}</td>
          <td>${r.project || '—'}</td>
          <td>${r.plan || 0}</td>
          <td>${r.actual || 0}</td>
          <td style="font-weight:700;color:${color}">${eff}%</td>
          <td>${r.manpower || '—'}</td>
        </tr>
      `;
    }).join('');

    content.innerHTML = `
      ${backBtn}
      <div class="panel-header">
        <div class="panel-title">📊 <span>Dashboard</span></div>
        <div style="font-size:12px;color:var(--slate)">
          Updated ${new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}
          &nbsp;·&nbsp;
          <a href="#" onclick="renderDashboard(document.getElementById('app-content'),'${backBtn.replace(/'/g,"\\'")}');return false"
             style="color:var(--gold);font-weight:700;text-decoration:none">↻ Refresh</a>
        </div>
      </div>

      ${summaryHtml}

      <div class="dash-grid">
        <!-- Active Lines Now -->
        <div class="card">
          <div class="card-header">🟢 Active Lines Right Now</div>
          <div class="table-wrap">
            ${activeLineRows ? `
              <table>
                <thead><tr>
                  <th>Line</th><th>BOQ</th><th>Started</th>
                  <th>Plan</th><th>Actual</th><th>Efficiency</th>
                </tr></thead>
                <tbody>${activeLineRows}</tbody>
              </table>
            ` : `<div class="empty-state"><div class="empty-icon">😴</div><p>No active sessions right now.</p></div>`}
          </div>
        </div>

        <!-- 14-day line performance -->
        <div class="card">
          <div class="card-header">📈 Line Performance — Last 14 Days</div>
          <div class="table-wrap">
            ${lineStatRows ? `
              <table>
                <thead><tr>
                  <th>Line</th><th>Days</th><th>Total Plan</th>
                  <th>Total Actual</th><th>Avg Efficiency</th>
                </tr></thead>
                <tbody>${lineStatRows}</tbody>
              </table>
            ` : `<div class="empty-state"><div class="empty-icon">📭</div><p>No data in last 14 days.</p></div>`}
          </div>
        </div>
      </div>

      <!-- Recent daily reports (full width) -->
      <div class="card dash-full">
        <div class="card-header">📋 Recent Daily Reports — Assembly</div>
        <div class="table-wrap">
          ${reportRows ? `
            <table>
              <thead><tr>
                <th>Date</th><th>Line</th><th>BOQ</th><th>Project</th>
                <th>Plan</th><th>Actual</th><th>Efficiency</th><th>Manpower</th>
              </tr></thead>
              <tbody>${reportRows}</tbody>
            </table>
          ` : `<div class="empty-state"><div class="empty-icon">📭</div><p>No reports found.</p></div>`}
        </div>
      </div>

      <!-- Machine shop placeholder -->
      <div class="card dash-full" style="margin-top:20px">
        <div class="card-header">🔧 Machine Shop</div>
        <div class="empty-state">
          <div class="empty-icon">🔧</div>
          <p>Machine shop data will appear here in Phase 2.</p>
        </div>
      </div>
    `;
  } catch(e) {
    content.innerHTML = `${backBtn}
      <div class="empty-state">
        <div class="empty-icon">⚠️</div>
        <p>Could not load dashboard data.<br><small>${e.message}</small></p>
      </div>`;
    console.error(e);
  }
}

// ═══════════════════════════════════════════════════════════
//  ADMIN PANEL
// ═══════════════════════════════════════════════════════════
async function renderAdmin(content, backBtn) {
  content.innerHTML = `${backBtn}<div class="spinner"></div>`;

  try {
    // Admin reads all users — requires .read: "auth != null" on /users
    const snap  = await db.ref('users').once('value');
    const users = snap.val() || {};

    const rows = Object.entries(users).map(([uid, u]) => {
      if (!u) return '';
      const actions  = u.actions || {};
      const badges   = ALL_ACTIONS
        .filter(a => actions[a.id])
        .map(a => `<span class="action-badge ab-${a.id}">${a.id}</span>`)
        .join('');

      const lastLogin = u.lastLogin
        ? new Date(u.lastLogin).toLocaleString('en-GB', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' })
        : '—';

      const adminBadge = u.isAdmin
        ? `<span class="action-badge" style="background:#fce4ec;color:#880e4f">admin</span>`
        : '';

      return `
        <tr>
          <td><strong>${u.userId || uid}</strong></td>
          <td>${u.displayName || '—'}</td>
          <td>
            <div class="action-badges">
              ${adminBadge}
              ${badges || '<span style="color:var(--slate);font-size:11px">None</span>'}
            </div>
          </td>
          <td style="font-size:12px;color:var(--slate)">${lastLogin}</td>
          <td>
            <button class="btn btn-ghost btn-sm" onclick="openEditUser('${uid}')">Edit</button>
            <button class="btn btn-secondary btn-sm" style="margin-left:6px" onclick="openPwdReset('${uid}','${u.userId||uid}')">Reset Pwd</button>
            <button class="btn btn-danger btn-sm" style="margin-left:6px" onclick="deleteUser('${uid}','${u.userId||uid}')">Delete</button>
          </td>
        </tr>
      `;
    }).join('');

    content.innerHTML = `
      ${backBtn}
      <div class="panel-header">
        <div class="panel-title">⚙️ <span>Admin Panel</span></div>
        <button class="btn btn-primary" onclick="openCreateUser()">+ Create User</button>
      </div>

      <div class="card">
        <div class="card-header">👥 User Accounts (${Object.keys(users).length})</div>
        <div class="table-wrap">
          ${Object.keys(users).length > 0 ? `
            <table>
              <thead>
                <tr>
                  <th>User ID</th>
                  <th>Name</th>
                  <th>Permissions</th>
                  <th>Last Login</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody>${rows}</tbody>
            </table>
          ` : `
            <div class="empty-state">
              <div class="empty-icon">👤</div>
              <p>No users yet. Create the first one.</p>
            </div>
          `}
        </div>
      </div>
    `;
  } catch (e) {
    content.innerHTML = `${backBtn}<div class="empty-state"><div class="empty-icon">⚠️</div><p>Could not load users.</p></div>`;
  }
}

async function openEditUser(uid) {
  editingUid = uid;
  document.getElementById('modal-title').textContent = 'Edit User';
  document.getElementById('modal-pwd-group').style.display = 'none'; // can't change pwd here

  try {
    const snap = await db.ref(`users/${uid}`).once('value');
    const u = snap.val() || {};
    document.getElementById('modal-uid').value  = u.userId || '';
    document.getElementById('modal-uid').disabled = true;
    document.getElementById('modal-name').value = u.displayName || '';
    renderActionsGrid(u.actions || {});
    document.getElementById('user-modal-overlay').classList.add('open');
  } catch (e) {
    showToast('Could not load user.', 'error');
  }
}

function closeUserModal() {
  document.getElementById('user-modal-overlay').classList.remove('open');
  editingUid = null;
}

// ─── Render action checkboxes ───
function renderActionsGrid(currentActions) {
  const grid = document.getElementById('actions-grid');
  grid.innerHTML = ALL_ACTIONS.map(a => {
    const checked = currentActions[a.id] ? 'checked' : '';
    return `
      <label class="action-check ${checked}" id="ac-${a.id}" onclick="toggleAction('${a.id}')">
        <input type="checkbox" ${checked}>
        <span class="check-dot"></span>
        ${a.label}
      </label>
    `;
  }).join('');
}

function toggleAction(id) {
  const el = document.getElementById(`ac-${id}`);
  el.classList.toggle('checked');
}

// ─── Save user ───
async function saveUser() {
  const btn      = document.getElementById('modal-save-btn');
  const rawId    = document.getElementById('modal-uid').value.trim().toUpperCase();
  const pwd      = document.getElementById('modal-pwd').value;
  const name     = document.getElementById('modal-name').value.trim();

  if (!rawId)  { showToast('User ID is required.', 'error'); return; }
  if (!name)   { showToast('Display name is required.', 'error'); return; }
  if (!editingUid && pwd.length < 6) {
    showToast('Password must be at least 6 characters.', 'error'); return;
  }

  // Collect checked actions
  const actions = {};
  ALL_ACTIONS.forEach(a => {
    if (document.getElementById(`ac-${a.id}`)?.classList.contains('checked')) {
      actions[a.id] = true;
    }
  });

  btn.disabled = true;
  btn.textContent = 'Saving…';

  try {
    if (editingUid) {
      // Edit existing: only update profile, not auth (can't change email/pwd from client without re-auth)
      await db.ref(`users/${editingUid}`).update({ displayName: name, actions });
      showToast('User updated.', 'success');
    } else {
      // Create new: create Firebase Auth user then write profile
      const email = rawId.toLowerCase() + EMAIL_DOMAIN;

      // Use a secondary app to create user without logging out admin
      const secondaryApp = firebase.initializeApp(firebaseConfig, 'secondary-' + Date.now());
      const secAuth = secondaryApp.auth();

      const cred = await secAuth.createUserWithEmailAndPassword(email, pwd);
      const newUid = cred.user.uid;
      await secAuth.signOut();
      await secondaryApp.delete();

      // Write profile to Realtime Database
      await db.ref(`users/${newUid}`).set({
        userId:      rawId,
        displayName: name,
        actions,
        isAdmin:     false,
        createdAt:   new Date().toISOString(),
        lastLogin:   null,
      });

      showToast(`User ${rawId} created.`, 'success');
    }

    closeUserModal();
    // Refresh admin panel
    openModule('admin');
  } catch (e) {
    console.error(e);
    const msg = e.code === 'auth/email-already-in-use'
      ? `User ID "${rawId}" already exists.`
      : 'Save failed: ' + (e.message || e.code);
    showToast(msg, 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Save User';
  }
}

// ─── Delete user ───
async function deleteUser(uid, userId) {
  if (!confirm(`Delete user "${userId}"?\n\nThis removes their profile and access. Their Firebase Auth account will remain (can be cleaned up in Firebase Console).`)) return;

  try {
    await db.ref(`users/${uid}`).remove();
    showToast(`User ${userId} removed.`, 'success');
    openModule('admin');
  } catch (e) {
    showToast('Delete failed.', 'error');
  }
}

// ── Utils ──────────────────────────────────────
function mpTs() { return new Date().toTimeString().slice(0,5); }
function mpTsLong() { return new Date().toLocaleString('en-GB',{hour12:false}).slice(0,16); }
function mpPad(n) { return n < 10 ? '0'+n : ''+n; }

function mpStBadge(s) {
  const map = {
    draft:           '<span class="sbadge sb-draft">Draft</span>',
    released:        '<span class="sbadge sb-released">Released</span>',
    'in-progress':   '<span class="sbadge sb-progress">In Progress</span>',
    wip:             '<span class="sbadge sb-wip">WIP</span>',
    'ready-assembly':'<span class="sbadge sb-ready">Ready for Assembly</span>',
    'sent-assembly': '<span class="sbadge sb-sent">Sent to Assembly</span>',
    transferred:     '<span class="sbadge sb-complete">Transferred</span>',
    complete:        '<span class="sbadge sb-complete">Complete</span>',
    partial:         '<span class="sbadge sb-pending">Partial</span>',
    'pending-verify':'<span class="sbadge sb-pending">Pending Verify</span>',
    approved:        '<span class="sbadge sb-approved">Approved</span>',
    rejected:        '<span class="sbadge sb-rejected">Rejected</span>',
    running:         '<span class="sbadge sb-running">Running</span>',
    paused:          '<span class="sbadge sb-paused">Paused</span>',
    idle:            '<span class="sbadge sb-draft">Idle</span>',
    downtime:        '<span class="sbadge sb-rejected">Downtime</span>',
  };
  return map[s] || `<span class="sbadge sb-draft">${s}</span>`;
}

function mpPct(o) {
  const total = (o.subs||[]).reduce((a,s)=>a+(s.qty||0),0);
  const done  = (o.subs||[]).reduce((a,s)=>a+(s.done||0)+(s.pendingDone||0),0);
  return total > 0 ? Math.round(done/total*100) : 0;
}

function mpProgBar(p) {
  p = Math.min(p,100);
  const col = p===100 ? 'pf-green' : p>50 ? 'pf-blue' : 'pf-amber';
  return `<div class="prog-bar"><div class="prog-fill ${col}" style="width:${p}%"></div></div>`;
}

function mpMatBadge(s) {
  if (!s.matBy) return '<span class="sbadge sb-draft">— Not entered</span>';
  if (s.matQty >= s.qty) return `<span class="sbadge sb-approved">✅ ${s.matQty}/${s.qty}</span>`;
  if (s.matQty > 0) return `<span class="sbadge sb-pending">⚠ ${s.matQty}/${s.qty}</span>`;
  return `<span class="sbadge sb-rejected">❌ 0/${s.qty}</span>`;
}

function mpCheckOrderStatus(moId) {
  const o = MP.orders.find(x=>x.id===moId);
  if (!o) return;
  const allDone = (o.subs||[]).every(s=>s.status==='complete');
  if (allDone) o.status = 'wip';
  else if ((o.subs||[]).some(s=>(s.done||0)>0||(s.pendingDone||0)>0) && o.status==='released') o.status='in-progress';
}

// ── Load data from Firebase ────────────────────
async function mpLoadAll() {
  const [oSnap, sSnap, mSnap, stSnap] = await Promise.all([
    MP.ordersRef().once('value'),
    MP.sessRef().once('value'),
    MP.machRef().once('value'),
    MP.settingsRef().once('value'),
  ]);

  // Orders
  const od = oSnap.val() || {};
  MP.orders = Object.entries(od).map(([id,o])=>({...o, id, subs: o.subs ? Object.values(o.subs) : []}));

  // Sessions
  const sd = sSnap.val() || {};
  MP.sessions = Object.entries(sd).map(([id,s])=>({...s,id}));

  // Machines — use Firebase if exists, else defaults
  const md = mSnap.val();
  if (md) MP.machines = Object.entries(md).map(([id,m])=>({...m,id}));

  // Settings
  const std = stSnap.val();
  if (std) {
    if (std.items)    MP.settings.items    = std.items;
    if (std.projects) MP.settings.projects = std.projects;
    if (std.cls)      MP.settings.cls      = std.cls;
    if (std.machines) MP.settings.machines = std.machines;
    if (std.dtr)      MP.settings.dtr      = std.dtr;
  }

  // Seed machines to Firebase if empty
  if (!md) {
    const machObj = {};
    MP.settings.machines.forEach(m => { machObj[m.id] = m; });
    await MP.machRef().set(machObj);
    MP.machines = MP.settings.machines.map(m=>({...m, status:'idle', job:'', prog:0}));
  }
}

async function mpSaveOrder(o) {
  const data = {...o};
  const subs = {};
  (o.subs||[]).forEach(s => { subs[s.id] = s; });
  data.subs = subs;
  await MP.ordersRef().child(o.id).set(data);
}

async function mpSaveSession(s) {
  await MP.sessRef().child(s.id).set(s);
}

async function mpSaveMachine(m) {
  await MP.machRef().child(m.id).set(m);
}

async function mpSaveSettings() {
  await MP.settingsRef().set(MP.settings);
}

  if (!c) return;
  switch (MP.planTab) {
    case 'orders':   mpRenderOrders(c);   break;
    case 'verify':   mpRenderVerify(c);   break;
    case 'wip':      mpRenderWip(c);      break;
    case 'machines': mpRenderMachines(c); break;

async function mpSaveNewOrder() {
  const cl       = document.getElementById('mo-cl')?.value;
  const project  = document.getElementById('mo-project')?.value;
  const pi       = document.getElementById('mo-pi')?.value.trim();
  const boqName  = document.getElementById('mo-boq')?.value.trim();
  const typology = document.getElementById('mo-typology')?.value.trim();
  const scope    = document.getElementById('mo-scope')?.value.trim();
  const batch    = document.getElementById('mo-batch')?.value.trim();

  if (!cl || !project) { showToast('CL Number and Project are required.','error'); return; }

  const projObj = MP.settings.projects.find(p=>p.name===project);
  const id = 'MO-' + Date.now();

  const order = {
    id, cl, project, code: projObj?.code||'',
    pi, boqName, boqId:'', typologyName: typology, typologyId:'',
    scope, batch, priority: false, status: 'draft',
    createdAt: new Date().toISOString(),
    createdBy: currentProfile?.userId || 'admin',
    subs: {},
  };

  await mpSaveOrder(order);
  MP.orders.push({...order, subs:[]});
  closeUserModal();
  showToast(`Order ${id} created.`, 'success');
  MP.schView = id;
  mpRenderTab();
}

// ── Sub-order operations ───────────────────────
async function mpUpdateSub(moId, soId, field, val) {
  const o = MP.orders.find(x=>x.id===moId);
  const s = (o?.subs||[]).find(x=>x.id===soId);
  if (!s) return;
  if (field==='qty')      s.qty      = parseInt(val)||s.qty;
  else if (field==='machine')  s.machine  = val;
  else if (field==='planDate') s.planDate = val;
  else if (field==='seq')      s.seq      = parseInt(val)||1;
  await mpSaveOrder(o);
}

function mpAddSub(moId) {
  const itemOpts = MP.settings.items.map(i=>`<option value="${i}">${i}</option>`).join('');
  document.getElementById('user-modal-overlay').classList.add('open');
  document.getElementById('modal-title').textContent = 'Add Component';
  document.getElementById('modal-pwd-group').style.display = 'none';
  document.getElementById('actions-grid').style.display = 'none';
  document.querySelector('.modal-body').innerHTML = `
    <div class="form-group">
      <label class="form-label">Item</label>
      <select class="form-input" id="ns-item"><option value="">Select item</option>${itemOpts}</select>
    </div>
    <div class="form-group">
      <label class="form-label">Quantity</label>
      <input class="form-input" type="number" id="ns-qty" min="1" placeholder="Enter quantity">
    </div>
  `;
  document.getElementById('modal-save-btn').textContent = 'Add Component';
  document.getElementById('modal-save-btn').onclick = () => mpSaveNewSub(moId);
}

async function mpSaveNewSub(moId) {
  const item = document.getElementById('ns-item')?.value;
  const qty  = parseInt(document.getElementById('ns-qty')?.value)||0;
  if (!item||qty<1) { showToast('Select item and enter quantity.','error'); return; }
  const o = MP.orders.find(x=>x.id===moId);
  if (!o) return;
  const sub = {
    id:'SO'+Date.now(), item, qty, done:0, pendingDone:0, rej:0, sentQty:0,
    planDate:'', machine:'', seq:(o.subs||[]).length+1, status:'draft',
    matQty:0, matRemarks:'', matBy:'', matUpdated:'',
  };
  if (!o.subs) o.subs = [];
  o.subs.push(sub);
  await mpSaveOrder(o);
  closeUserModal();
  showToast('Component added.','success');
  mpRenderTab();
}

async function mpRemoveSub(moId, soId) {
  const o = MP.orders.find(x=>x.id===moId);
  const s = (o?.subs||[]).find(x=>x.id===soId);
  if (s && (s.done>0||s.pendingDone>0)) { showToast('Cannot remove — production already recorded.','error'); return; }
  if (!confirm('Remove this component?')) return;
  o.subs = (o.subs||[]).filter(x=>x.id!==soId);
  await mpSaveOrder(o);
  showToast('Component removed.','success');
  mpRenderTab();
}

async function mpReleaseOrder(moId) {
  const o = MP.orders.find(x=>x.id===moId);
  const invalid = (o?.subs||[]).filter(s=>!s.machine||!s.planDate||!s.qty);
  if (invalid.length) { showToast('Assign machine, date and qty to all components before releasing.','error'); return; }
  (o.subs||[]).forEach(s=>{ if(s.status==='draft') s.status='released'; });
  o.status = 'released';
  await mpSaveOrder(o);
  showToast(`${o.cl} released to operators.`,'success');
  mpRenderTab();
}

async function mpSetPriority(moId) {
  const o = MP.orders.find(x=>x.id===moId);
  if (o) { o.priority=true; await mpSaveOrder(o); showToast('Flagged as urgent.','success'); mpRenderTab(); }
}

async function mpDeleteOrder(moId) {
  if (!confirm('Delete this order? This cannot be undone.')) return;
  await MP.ordersRef().child(moId).remove();
  MP.orders = MP.orders.filter(x=>x.id!==moId);
  MP.schView = null;
  showToast('Order deleted.','success');
  mpRenderTab();
}

async function mpSendToAssembly(moId, soId) {
  const o = MP.orders.find(x=>x.id===moId);
  const s = (o?.subs||[]).find(x=>x.id===soId);
  const inp = document.getElementById('send-'+soId);
  const qty = parseInt(inp?.value)||0;
  if (qty<1) { showToast('Enter quantity to send.','error'); return; }
  if (qty > s.done-s.sentQty) { showToast(`Cannot send more than available (${s.done-s.sentQty}).`,'error'); return; }
  s.sentQty += qty;
  if (s.done>=s.qty && s.sentQty>=s.done) s.status='complete';
  mpCheckOrderStatus(moId);

  // Write to stockMovements for Assembly team to see
  const moveId = 'SM-'+Date.now();
  await db.ref(`stockMovements/${moveId}`).set({
    id: moveId,
    moId, soId,
    cl: o.cl, project: o.project, item: s.item,
    qty, sentAt: new Date().toISOString(),
    sentBy: currentProfile?.userId||'planner',
    status: 'sent-assembly',
  });

  await mpSaveOrder(o);
  showToast(`${qty} ${s.item} sent to assembly.`,'success');
  mpRenderTab();
}

async function mpTransferAll(moId) {
  const o = MP.orders.find(x=>x.id===moId);
  if (!o) return;
  o.status = 'transferred';
  await mpSaveOrder(o);
  showToast(`${o.cl} fully transferred to assembly.`,'success');
  mpRenderTab();
}

          <div class="metric-box"><div class="lbl">Remaining</div><div class="val">${s?Math.max(0,s.qty-s.done-sess.qty):'—'}</div></div>
        </div>

          <button class="btn btn-primary" onclick="mpApprove('${sess.id}')">✅ Approve → FG</button>

          <button class="btn btn-danger" onclick="mpReject('${sess.id}')">✗ Reject</button>
        </div>

async function mpApprove(sessId) {
  const sess = MP.sessions.find(x=>x.id===sessId);
  if (!sess) return;
  sess.status = 'approved';
  const o = MP.orders.find(x=>x.id===sess.moId);
  const s = (o?.subs||[]).find(x=>x.id===sess.soId);
  if (s) {
    s.done += sess.qty;
    s.rej  += sess.rej||0;
    s.pendingDone = Math.max(0,(s.pendingDone||0)-sess.qty);
    s.status = 'complete';
  }
  mpCheckOrderStatus(sess.moId);
  await mpSaveSession(sess);
  if (o) await mpSaveOrder(o);
  showToast('Approved → FG.','success');
  await mpRefresh();
}

async function mpApproveRoute(sessId) {
  const sess = MP.sessions.find(x=>x.id===sessId);
  if (!sess) return;
  const o = MP.orders.find(x=>x.id===sess.moId);
  const s = (o?.subs||[]).find(x=>x.id===sess.soId);
  const remaining = s ? Math.max(0,s.qty-(s.done||0)-sess.qty-(s.rej||0)) : 0;

  const machOpts = MP.machines.map(m=>`<option value="${m.name}">${m.name} (${m.machId})</option>`).join('');
  const today = new Date().toISOString().slice(0,10);

  document.getElementById('user-modal-overlay').classList.add('open');
  document.getElementById('modal-title').textContent = 'Approve & Route to Next Machine';
  document.getElementById('modal-pwd-group').style.display = 'none';
  document.getElementById('actions-grid').style.display = 'none';
  document.querySelector('.modal-body').innerHTML = `
    <div class="al al-info">Approve ${sess.qty} pcs. Route remaining ${remaining} pcs to another machine.</div>
    <div class="form-group" style="margin-top:12px">
      <label class="form-label">Route to Machine</label>
      <select class="form-input" id="rt-m"><option value="">Select</option>${machOpts}</select>
    </div>
    <div class="form-group">
      <label class="form-label">Plan Date</label>
      <input class="form-input" type="date" id="rt-d" value="${today}">
    </div>
    <div class="form-group">
      <label class="form-label">Qty to Route</label>
      <input class="form-input" type="number" id="rt-q" value="${remaining}" min="1">
    </div>
  `;
  document.getElementById('modal-save-btn').textContent = 'Approve & Route';
  document.getElementById('modal-save-btn').onclick = () => mpDoRoute(sessId);
}

async function mpDoRoute(sessId) {
  const mach = document.getElementById('rt-m')?.value;
  const date = document.getElementById('rt-d')?.value;
  const qty  = parseInt(document.getElementById('rt-q')?.value)||0;
  if (!mach||!date||qty<1) { showToast('Fill all fields.','error'); return; }

  const sess = MP.sessions.find(x=>x.id===sessId);
  sess.status = 'approved';
  const o = MP.orders.find(x=>x.id===sess.moId);
  const s = (o?.subs||[]).find(x=>x.id===sess.soId);
  if (s) {
    s.done += sess.qty;
    s.pendingDone = Math.max(0,(s.pendingDone||0)-sess.qty);
    s.status = 'partial';
  }
  if (o) {
    o.subs = o.subs||[];
    o.subs.push({
      id:'SO'+Date.now(), item:(s?.item||'')+' (Routed)', qty, done:0, pendingDone:0, rej:0, sentQty:0,
      planDate:date, machine:mach, seq:(o.subs.length+1), status:'released',
      matQty:0, matRemarks:'Routed from '+sess.machType, matBy:'', matUpdated:'',
    });
    await mpSaveOrder(o);
  }
  await mpSaveSession(sess);
  closeUserModal();
  showToast('Approved and routed.','success');
  await mpRefresh();
}

async function mpReject(sessId) {
  if (!confirm('Reject this session?')) return;
  const sess = MP.sessions.find(x=>x.id===sessId);
  sess.status = 'rejected';
  const o = MP.orders.find(x=>x.id===sess.moId);
  const s = (o?.subs||[]).find(x=>x.id===sess.soId);
  if (s) s.pendingDone = Math.max(0,(s.pendingDone||0)-sess.qty);
  await mpSaveSession(sess);
  if (o) await mpSaveOrder(o);
  showToast('Session rejected.','info');
  await mpRefresh();
}

      </div>
