<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sobha Modular PMS</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
  /* ── Design tokens (matching existing Assembly PMS) ── */
  :root {
    --navy:       #1a1a2e;
    --charcoal:   #2c2c3e;
    --gold:       #d4af37;
    --dark-gold:  #b8941f;
    --light-gold: #f4e5c2;
    --bronze:     #cd7f32;
    --cream:      #fafaf8;
    --white:      #ffffff;
    --slate:      #708090;
    --success:    #2e7d32;
    --danger:     #c62828;
    --warning:    #e65100;
    --info:       #1565c0;
    --radius:     10px;
    --shadow:     0 4px 20px rgba(0,0,0,0.12);
    --shadow-lg:  0 8px 40px rgba(0,0,0,0.18);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: linear-gradient(135deg, var(--charcoal) 0%, var(--navy) 60%, #1a1a2e 100%);
    min-height: 100vh;
    color: var(--navy);
  }

  /* ── Screens ── */
  .screen { display: none; min-height: 100vh; }
  .screen.active { display: flex; flex-direction: column; }

  /* ─────────────────────────────────────────────
     LOGIN SCREEN
  ───────────────────────────────────────────── */
  #screen-login {
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .login-card {
    background: var(--white);
    border-radius: 16px;
    box-shadow: var(--shadow-lg);
    width: 100%;
    max-width: 400px;
    overflow: hidden;
  }

  .login-header {
    background: linear-gradient(135deg, var(--charcoal), var(--navy));
    padding: 32px 32px 24px;
    text-align: center;
    border-bottom: 3px solid var(--gold);
  }

  .login-logo {
    width: 80px;
    height: 80px;
    object-fit: contain;
    background: rgba(255,255,255,0.95);
    border-radius: 12px;
    padding: 8px;
    margin-bottom: 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.3);
  }

  .login-title {
    color: var(--white);
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }

  .login-subtitle {
    color: var(--light-gold);
    font-size: 12px;
    margin-top: 4px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .login-body {
    padding: 32px;
  }

  .form-group {
    margin-bottom: 18px;
  }

  .form-label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--slate);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 7px;
  }

  .form-input {
    width: 100%;
    padding: 11px 14px;
    border: 1.5px solid #e0e0e0;
    border-radius: var(--radius);
    font-size: 15px;
    font-family: inherit;
    color: var(--navy);
    transition: border-color 0.2s, box-shadow 0.2s;
    outline: none;
    background: var(--cream);
  }

  .form-input:focus {
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(212,175,55,0.15);
    background: var(--white);
  }

  .btn-login {
    width: 100%;
    padding: 13px;
    background: linear-gradient(135deg, var(--gold), var(--dark-gold));
    color: var(--navy);
    border: none;
    border-radius: var(--radius);
    font-size: 15px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    letter-spacing: 0.5px;
    transition: opacity 0.2s, transform 0.1s;
    margin-top: 6px;
  }

  .btn-login:hover { opacity: 0.92; }
  .btn-login:active { transform: scale(0.99); }
  .btn-login:disabled { opacity: 0.55; cursor: not-allowed; }

  .login-error {
    background: #fdecea;
    color: var(--danger);
    border: 1px solid #f5c6c6;
    border-radius: var(--radius);
    padding: 10px 14px;
    font-size: 13px;
    margin-top: 14px;
    display: none;
  }

  .login-footer {
    text-align: center;
    padding: 0 32px 24px;
    font-size: 11px;
    color: var(--slate);
  }

  /* ─────────────────────────────────────────────
     APP SHELL (post-login)
  ───────────────────────────────────────────── */
  #screen-app {
    background: var(--cream);
    min-height: 100vh;
  }

  /* Top Navigation Bar */
  .topbar {
    background: linear-gradient(135deg, var(--charcoal), var(--navy));
    border-bottom: 2px solid var(--gold);
    padding: 0 20px;
    display: flex;
    align-items: center;
    gap: 16px;
    height: 60px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 12px rgba(0,0,0,0.25);
  }

  .topbar-logo {
    width: 36px;
    height: 36px;
    object-fit: contain;
    background: rgba(255,255,255,0.92);
    border-radius: 7px;
    padding: 4px;
  }

  .topbar-brand {
    color: var(--white);
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.3px;
    flex: 1;
  }

  .topbar-brand span {
    color: var(--gold);
  }

  .topbar-user {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .user-badge {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(212,175,55,0.4);
    border-radius: 20px;
    padding: 5px 12px;
    color: var(--light-gold);
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .btn-logout {
    background: rgba(198,40,40,0.2);
    border: 1px solid rgba(198,40,40,0.4);
    color: #ef9a9a;
    border-radius: 7px;
    padding: 6px 12px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
    font-family: inherit;
  }

  .btn-logout:hover { background: rgba(198,40,40,0.35); }

  /* App Content */
  .app-content {
    padding: 28px 24px;
    max-width: 1200px;
    margin: 0 auto;
  }

  /* ─────────────────────────────────────────────
     HOME / MODULE TILES
  ───────────────────────────────────────────── */
  .home-greeting {
    margin-bottom: 28px;
  }

  .home-greeting h1 {
    font-size: 26px;
    font-weight: 700;
    color: var(--navy);
  }

  .home-greeting p {
    color: var(--slate);
    font-size: 14px;
    margin-top: 4px;
  }

  .modules-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
  }

  @media (max-width: 900px) {
    .modules-grid { grid-template-columns: repeat(2, 1fr); }
  }

  @media (max-width: 560px) {
    .modules-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  }

  .module-card {
    background: var(--white);
    border-radius: 14px;
    padding: 24px 20px;
    border: 2px solid var(--light-gold);
    cursor: pointer;
    transition: border-color 0.2s, box-shadow 0.2s, transform 0.15s;
    position: relative;
    overflow: hidden;
  }

  .module-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--gold), var(--bronze));
    opacity: 0;
    transition: opacity 0.2s;
  }

  .module-card:hover {
    border-color: var(--gold);
    box-shadow: var(--shadow);
    transform: translateY(-2px);
  }

  .module-card:hover::before { opacity: 1; }

  .module-icon {
    font-size: 32px;
    margin-bottom: 12px;
    display: block;
  }

  .module-name {
    font-size: 16px;
    font-weight: 700;
    color: var(--navy);
    margin-bottom: 6px;
  }

  .module-desc {
    font-size: 12px;
    color: var(--slate);
    line-height: 1.5;
  }

  .module-tag {
    display: inline-block;
    margin-top: 12px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 20px;
  }

  .tag-assembly { background: #e8f5e9; color: #2e7d32; }
  .tag-machine  { background: #e3f2fd; color: #1565c0; }
  .tag-shared   { background: #fef9e7; color: #7d6608; }
  .tag-admin    { background: #fce4ec; color: #880e4f; }

  /* ─────────────────────────────────────────────
     ADMIN PANEL
  ───────────────────────────────────────────── */
  .panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
    flex-wrap: wrap;
    gap: 12px;
  }

  .panel-title {
    font-size: 22px;
    font-weight: 700;
    color: var(--navy);
  }

  .panel-title span { color: var(--gold); }

  .btn {
    padding: 10px 18px;
    border-radius: var(--radius);
    font-size: 13px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    border: none;
    transition: opacity 0.2s, transform 0.1s;
  }

  .btn:active { transform: scale(0.98); }
  .btn-primary { background: linear-gradient(135deg, var(--gold), var(--dark-gold)); color: var(--navy); }
  .btn-secondary { background: var(--navy); color: var(--white); }
  .btn-danger { background: var(--danger); color: var(--white); }
  .btn-ghost { background: transparent; color: var(--navy); border: 1.5px solid #ddd; }
  .btn-sm { padding: 6px 12px; font-size: 12px; }
  .btn:hover { opacity: 0.88; }

  /* User Table */
  .card {
    background: var(--white);
    border-radius: 14px;
    border: 1px solid var(--light-gold);
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  .card-header {
    padding: 16px 20px;
    background: linear-gradient(135deg, var(--charcoal), var(--navy));
    color: var(--white);
    font-size: 14px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 2px solid var(--gold);
  }

  .table-wrap { overflow-x: auto; }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }

  th {
    background: #f5f5f5;
    padding: 10px 14px;
    text-align: left;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.7px;
    color: var(--slate);
    border-bottom: 1px solid #e8e8e8;
  }

  td {
    padding: 12px 14px;
    border-bottom: 1px solid #f0f0f0;
    color: var(--navy);
    vertical-align: middle;
  }

  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #fafaf8; }

  .action-badges {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }

  .action-badge {
    font-size: 10px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 10px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }

  .ab-plan     { background: #e8f5e9; color: #1b5e20; }
  .ab-machine  { background: #e3f2fd; color: #0d47a1; }
  .ab-material { background: #fff3e0; color: #e65100; }
  .ab-approve  { background: #f3e5f5; color: #4a148c; }
  .ab-monitor  { background: #e0f7fa; color: #006064; }
  .ab-view     { background: #f1f8e9; color: #33691e; }
  .ab-dashboard{ background: #fef9e7; color: #7d6608; }

  .status-active   { color: var(--success); font-weight: 700; }
  .status-inactive { color: var(--slate); }

  /* User Modal */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    z-index: 500;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .modal-overlay.open { display: flex; }

  .modal {
    background: var(--white);
    border-radius: 16px;
    width: 100%;
    max-width: 520px;
    box-shadow: var(--shadow-lg);
    overflow: hidden;
    animation: modalIn 0.2s ease;
  }

  @keyframes modalIn {
    from { opacity: 0; transform: translateY(-16px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .modal-header {
    background: linear-gradient(135deg, var(--charcoal), var(--navy));
    border-bottom: 2px solid var(--gold);
    padding: 18px 22px;
    color: var(--white);
    font-size: 16px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .modal-close {
    background: none;
    border: none;
    color: var(--light-gold);
    font-size: 20px;
    cursor: pointer;
    line-height: 1;
  }

  .modal-body { padding: 22px; }

  .modal-footer {
    padding: 14px 22px;
    background: #f9f9f9;
    border-top: 1px solid #eee;
    display: flex;
    gap: 10px;
    justify-content: flex-end;
  }

  /* Actions checkboxes */
  .actions-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-top: 6px;
  }

  .action-check {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 8px 10px;
    border: 1.5px solid #e0e0e0;
    border-radius: 8px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    font-size: 12px;
    font-weight: 600;
    color: var(--navy);
    user-select: none;
  }

  .action-check input { display: none; }

  .action-check.checked {
    border-color: var(--gold);
    background: linear-gradient(135deg, #fffef0, var(--light-gold));
  }

  .check-dot {
    width: 14px;
    height: 14px;
    border: 2px solid #ccc;
    border-radius: 4px;
    flex-shrink: 0;
    transition: background 0.15s, border-color 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .action-check.checked .check-dot {
    background: var(--gold);
    border-color: var(--dark-gold);
  }

  .check-dot::after {
    content: '✓';
    font-size: 9px;
    color: var(--navy);
    display: none;
    font-weight: 900;
  }

  .action-check.checked .check-dot::after { display: block; }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--navy);
    color: var(--white);
    padding: 12px 18px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 600;
    border-left: 4px solid var(--gold);
    box-shadow: var(--shadow-lg);
    z-index: 9999;
    display: none;
    animation: slideUp 0.25s ease;
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .toast.success { border-left-color: #4caf50; }
  .toast.error   { border-left-color: var(--danger); }

  /* Empty state */
  .empty-state {
    text-align: center;
    padding: 48px 20px;
    color: var(--slate);
  }

  .empty-state .empty-icon { font-size: 48px; margin-bottom: 12px; }
  .empty-state p { font-size: 14px; }

  /* Back button */
  .btn-back {
    background: none;
    border: none;
    color: var(--slate);
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 20px;
    padding: 0;
    font-weight: 600;
    transition: color 0.2s;
  }

  .btn-back:hover { color: var(--navy); }

  /* Loading spinner */
  .spinner {
    width: 36px; height: 36px;
    border: 3px solid var(--light-gold);
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin: 60px auto;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* Placeholder module screens */
  .placeholder-screen {
    text-align: center;
    padding: 80px 20px;
  }

  .placeholder-icon { font-size: 64px; margin-bottom: 20px; }

  .placeholder-screen h2 {
    font-size: 24px;
    font-weight: 700;
    color: var(--navy);
    margin-bottom: 10px;
  }

  .placeholder-screen p {
    color: var(--slate);
    font-size: 14px;
    max-width: 360px;
    margin: 0 auto;
    line-height: 1.6;
  }

  .coming-soon-badge {
    display: inline-block;
    margin-top: 20px;
    background: var(--light-gold);
    color: var(--navy);
    font-size: 11px;
    font-weight: 700;
    padding: 5px 14px;
    border-radius: 20px;
    letter-spacing: 1px;
    text-transform: uppercase;
    border: 1px solid var(--gold);
  }

  /* Dashboard summary cards */
  .summary-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 14px;
    margin-bottom: 24px;
  }

  .summary-card {
    background: var(--white);
    border-radius: 12px;
    padding: 18px;
    border: 1px solid var(--light-gold);
    box-shadow: var(--shadow);
  }

  .summary-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--slate);
    margin-bottom: 8px;
  }

  .summary-value {
    font-size: 32px;
    font-weight: 800;
    color: var(--navy);
    line-height: 1;
  }

  .summary-sub {
    font-size: 11px;
    color: var(--slate);
    margin-top: 4px;
  }

  .summary-card.gold .summary-value { color: var(--dark-gold); }
  .summary-card.green .summary-value { color: var(--success); }
  .summary-card.red .summary-value { color: var(--danger); }

  /* Responsive */
  @media (max-width: 600px) {
    .app-content { padding: 16px; }
    .modules-grid { grid-template-columns: 1fr 1fr; gap: 12px; }
    .module-card { padding: 16px 14px; }
    .module-icon { font-size: 24px; }
    .module-name { font-size: 13px; }
    .module-desc { display: none; }
    .actions-grid { grid-template-columns: repeat(2, 1fr); }
    .topbar-brand { font-size: 13px; }
  }
</style>
</head>
<body>

<script>
// ═══════════════════════════════════════════════════════════
//  FIREBASE INIT
// ═══════════════════════════════════════════════════════════
const firebaseConfig = {
  apiKey:            "AIzaSyBkx_aqxvWlX0HGWD0xxTB7WbSegoTSZSo",
  authDomain:        "sobham-pms.firebaseapp.com",
  databaseURL:       "https://sobham-pms-default-rtdb.firebaseio.com",
  projectId:         "sobham-pms",
  storageBucket:     "sobham-pms.firebasestorage.app",
  messagingSenderId: "1074864287062",
  appId:             "1:1074864287062:web:ba9a9cba154bd3b0c6faf7"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db   = firebase.database();

// ═══════════════════════════════════════════════════════════
//  CONSTANTS
// ═══════════════════════════════════════════════════════════
const EMAIL_DOMAIN = '@smpms.com';

const ALL_ACTIONS = [
  { id: 'dashboard', label: '📊 Dashboard' },
  { id: 'plan',      label: '📋 Plan'      },
  { id: 'machine',   label: '🔧 Machine'   },
  { id: 'material',  label: '📦 Material'  },
  { id: 'approve',   label: '✅ Approve'   },
  { id: 'monitor',   label: '📺 Monitor'   },
  { id: 'view',      label: '👁 View'      },
];

// Module definitions: each action that's granted shows these cards on home
const MODULES = [
  {
    id: 'dashboard',
    action: 'dashboard',
    icon: '📊',
    name: 'Dashboard',
    desc: 'Unified overview of assembly lines and machine shop',
    tag: 'shared',
    tagLabel: 'All Departments',
  },
  {
    id: 'plan',
    action: 'plan',
    icon: '📋',
    name: 'Orders & Planning',
    desc: 'Create manufacturing orders, schedule sub-orders',
    tag: 'machine',
    tagLabel: 'Machine Shop',
  },
  {
    id: 'machine',
    action: 'machine',
    icon: '🔧',
    name: 'Run',
    desc: 'Operator screen — log production sessions on machines',
    tag: 'machine',
    tagLabel: 'Machine Shop',
  },
  {
    id: 'material',
    action: 'material',
    icon: '📦',
    name: 'Material',
    desc: 'Track material availability, mark parts ready for assembly',
    tag: 'machine',
    tagLabel: 'Machine Shop',
  },
  {
    id: 'approve',
    action: 'approve',
    icon: '✅',
    name: 'Verify / WIP',
    desc: 'Supervisor quality check and routing to assembly or FG',
    tag: 'machine',
    tagLabel: 'Machine Shop',
  },
  {
    id: 'monitor',
    action: 'monitor',
    icon: '📺',
    name: 'Monitor',
    desc: 'Assembly line shift tracking, hourly targets and actuals',
    tag: 'assembly',
    tagLabel: 'Assembly',
  },
  {
    id: 'view',
    action: 'view',
    icon: '👁',
    name: 'Live View',
    desc: 'Read-only display — for screens, TVs, and managers',
    tag: 'shared',
    tagLabel: 'All Departments',
  },
  {
    id: 'stock',
    action: 'view', // stock visible to anyone with 'view'
    icon: '🗃',
    name: 'Stock Available',
    desc: 'Parts completed in machine shop, ready for assembly lines',
    tag: 'assembly',
    tagLabel: 'Assembly',
  },
];

// ═══════════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════════
let currentUser  = null;  // Firebase Auth user
let currentProfile = null; // /users/{uid} data
let editingUid   = null;  // uid being edited in modal (null = new)
let toastTimer   = null;

// ═══════════════════════════════════════════════════════════
//  AUTH STATE
// ═══════════════════════════════════════════════════════════
auth.onAuthStateChanged(async (user) => {
  if (user) {
    currentUser = user;
    try {
      const snap = await db.ref(`users/${user.uid}`).once('value');
      currentProfile = snap.val();

      if (!currentProfile) {
        // Auth account exists but no profile — treat as invalid
        await auth.signOut();
        showLogin();
        showError('Account not configured. Contact admin.');
        return;
      }

      // Update last login timestamp
      await db.ref(`users/${user.uid}/lastLogin`).set(
        new Date().toISOString()
      );

      showApp();
    } catch (e) {
      console.error(e);
      showLogin();
    }
  } else {
    currentUser  = null;
    currentProfile = null;
    showLogin();
  }
});

// ═══════════════════════════════════════════════════════════
//  SCREEN HELPERS
// ═══════════════════════════════════════════════════════════
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function showLogin() { showScreen('screen-login'); }

function showApp() {
  showScreen('screen-app');
  const uid = currentProfile?.userId || currentUser?.email?.split('@')[0]?.toUpperCase() || '—';
  document.getElementById('topbar-username').textContent = uid;
  renderHome();
}

// ═══════════════════════════════════════════════════════════
//  LOGIN
// ═══════════════════════════════════════════════════════════
function doLogin() {
  const rawId = document.getElementById('inp-username').value.trim();
  const pwd   = document.getElementById('inp-password').value;

  if (!rawId || !pwd) { showError('Please enter your User ID and password.'); return; }

  const email = rawId.toLowerCase() + EMAIL_DOMAIN;
  const btn   = document.getElementById('btn-login');
  btn.disabled = true;
  btn.textContent = 'Signing in…';
  clearError();

  auth.signInWithEmailAndPassword(email, pwd)
    .catch(err => {
      btn.disabled = false;
      btn.textContent = 'Sign In';
      const msg = err.code === 'auth/user-not-found' || err.code === 'auth/wrong-password' || err.code === 'auth/invalid-credential'
        ? 'Invalid User ID or password.'
        : 'Sign in failed. Please try again.';
      showError(msg);
    });
  // Success is handled by onAuthStateChanged
}

// Allow Enter key in login form
document.getElementById('inp-password').addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});
document.getElementById('inp-username').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('inp-password').focus();
});

function doLogout() {
  auth.signOut();
}

function showError(msg) {
  const el = document.getElementById('login-error');
  el.textContent = msg;
  el.style.display = 'block';
}

function clearError() {
  document.getElementById('login-error').style.display = 'none';
}

// Reset login button if auth state changes back
auth.onAuthStateChanged(u => {
  if (!u) {
    const btn = document.getElementById('btn-login');
    if (btn) { btn.disabled = false; btn.textContent = 'Sign In'; }
  }
});

// ═══════════════════════════════════════════════════════════
//  HOME — MODULE TILES
// ═══════════════════════════════════════════════════════════
function renderHome() {
  const actions  = currentProfile?.actions || {};
  const isAdmin  = currentProfile?.isAdmin === true;

  // Which modules to show
  const visible = MODULES.filter(m => isAdmin || actions[m.action]);

  const content = document.getElementById('app-content');

  const name = currentProfile?.displayName
    ? currentProfile.displayName.split(' ')[0]
    : (currentProfile?.userId || 'there');

  const greeting = getGreeting();

  let html = `
    <div class="home-greeting">
      <h1>${greeting}, ${name} 👋</h1>
      <p>${new Date().toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long', year:'numeric' })}</p>
    </div>
    <div class="modules-grid">
  `;

  if (visible.length === 0) {
    html += `
      <div class="empty-state" style="grid-column:1/-1">
        <div class="empty-icon">🔒</div>
        <p>No modules assigned to your account yet.<br>Contact your administrator.</p>
      </div>
    `;
  } else {
    visible.forEach(m => {
      html += `
        <div class="module-card" onclick="openModule('${m.id}')">
          <span class="module-icon">${m.icon}</span>
          <div class="module-name">${m.name}</div>
          <div class="module-desc">${m.desc}</div>
          <span class="module-tag tag-${m.tag}">${m.tagLabel}</span>
        </div>
      `;
    });
  }

  // Admin tile — always shown to admin users
  if (isAdmin) {
    html += `
      <div class="module-card" onclick="openModule('admin')">
        <span class="module-icon">⚙️</span>
        <div class="module-name">Admin Panel</div>
        <div class="module-desc">Manage users, permissions, and system settings</div>
        <span class="module-tag tag-admin">Admin Only</span>
      </div>
    `;
  }

  html += `</div>`;
  content.innerHTML = html;
}

function getGreeting() {
  const h = new Date().getHours();
  if (h < 12) return 'Good morning';
  if (h < 17) return 'Good afternoon';
  return 'Good evening';
}

// ═══════════════════════════════════════════════════════════
//  MODULE ROUTER
// ═══════════════════════════════════════════════════════════
function openModule(id) {
  const content = document.getElementById('app-content');

  const backBtn = `<button class="btn-back" onclick="renderHome()">← Back to Home</button>`;

  switch (id) {
    case 'admin':     renderAdmin(content, backBtn);     break;
    case 'dashboard': renderDashboard(content, backBtn); break;
    default:          renderPlaceholder(content, backBtn, id); break;
  }
}

// ─── Placeholder for modules coming in Phase 2/3 ───
function renderPlaceholder(content, backBtn, id) {
  const mod = MODULES.find(m => m.id === id) || { icon: '🔧', name: id, desc: '' };
  content.innerHTML = `
    ${backBtn}
    <div class="placeholder-screen">
      <div class="placeholder-icon">${mod.icon}</div>
      <h2>${mod.name}</h2>
      <p>${mod.desc || 'This module is being built and will be available soon.'}</p>
      <div class="coming-soon-badge">Coming in Phase 2</div>
    </div>
  `;
}

// ═══════════════════════════════════════════════════════════
//  DASHBOARD (reads existing Assembly PMS Firebase data)
// ═══════════════════════════════════════════════════════════
async function renderDashboard(content, backBtn) {
  content.innerHTML = `${backBtn}<div class="spinner"></div>`;

  try {
    // Read today's daily reports from existing path
    const today     = new Date().toISOString().slice(0, 10); // YYYY-MM-DD
    const repSnap   = await db.ref('daily_reports').orderByKey().limitToLast(30).once('value');
    const repData   = repSnap.val() || {};

    // Read active sessions
    const sessSnap  = await db.ref('sessions').once('value');
    const sessData  = sessSnap.val() || {};

    // Compute summary from sessions active today
    let totalActual = 0, totalPlan = 0, activeLines = 0;
    const recentSessions = [];

    Object.values(sessData).forEach(s => {
      if (!s) return;
      const started = s.startTime ? new Date(s.startTime).toISOString().slice(0,10) : '';
      if (started === today && s.status === 'active') {
        activeLines++;
        totalActual += s.actualCount || 0;
        totalPlan   += s.plan || 0;
        recentSessions.push(s);
      }
    });

    const eff = totalPlan > 0 ? Math.round((totalActual / totalPlan) * 100) : 0;

    // Daily reports summary (last 7 days)
    const reportRows = [];
    const allReports = [];
    Object.values(repData).forEach(dateGroup => {
      if (!dateGroup) return;
      Object.values(dateGroup).forEach(r => { if (r) allReports.push(r); });
    });

    allReports.sort((a,b) => (b.savedAt||'') > (a.savedAt||'') ? 1 : -1);
    const recentReports = allReports.slice(0, 8);

    recentReports.forEach(r => {
      const effVal = r.plan > 0 ? Math.round((r.actual / r.plan) * 100) : 0;
      reportRows.push(`
        <tr>
          <td>${r.date || '—'}</td>
          <td>Line ${r.line || '—'}</td>
          <td>${r.boq || '—'}</td>
          <td>${r.plan || 0}</td>
          <td>${r.actual || 0}</td>
          <td style="font-weight:700;color:${effVal>=85?'var(--success)':effVal>=70?'var(--warning)':'var(--danger)'}">
            ${effVal}%
          </td>
        </tr>
      `);
    });

    content.innerHTML = `
      ${backBtn}
      <div class="panel-header">
        <div class="panel-title">📊 <span>Dashboard</span></div>
        <div style="font-size:12px;color:var(--slate)">Updated ${new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}</div>
      </div>

      <div class="summary-grid">
        <div class="summary-card">
          <div class="summary-label">Active Lines Today</div>
          <div class="summary-value">${activeLines}</div>
          <div class="summary-sub">Shifts in progress</div>
        </div>
        <div class="summary-card gold">
          <div class="summary-label">Total Actual</div>
          <div class="summary-value">${totalActual}</div>
          <div class="summary-sub">Units produced today</div>
        </div>
        <div class="summary-card">
          <div class="summary-label">Today's Plan</div>
          <div class="summary-value">${totalPlan}</div>
          <div class="summary-sub">Target for today</div>
        </div>
        <div class="summary-card ${eff>=85?'green':eff>=70?'':'red'}">
          <div class="summary-label">Overall Efficiency</div>
          <div class="summary-value">${eff}%</div>
          <div class="summary-sub">Actual vs Plan</div>
        </div>
      </div>

      <div class="card">
        <div class="card-header">📋 Recent Daily Reports — Assembly</div>
        <div class="table-wrap">
          ${recentReports.length > 0 ? `
            <table>
              <thead>
                <tr>
                  <th>Date</th><th>Line</th><th>BOQ</th>
                  <th>Plan</th><th>Actual</th><th>Efficiency</th>
                </tr>
              </thead>
              <tbody>${reportRows.join('')}</tbody>
            </table>
          ` : `<div class="empty-state"><div class="empty-icon">📭</div><p>No reports found yet.</p></div>`}
        </div>
      </div>

      <div class="card" style="margin-top:16px">
        <div class="card-header">🏭 Machine Shop</div>
        <div class="empty-state">
          <div class="empty-icon">🔧</div>
          <p>Machine shop data will appear here in Phase 2,<br>once orders are migrated to Firebase.</p>
        </div>
      </div>
    `;
  } catch (e) {
    content.innerHTML = `${backBtn}<div class="empty-state"><div class="empty-icon">⚠️</div><p>Could not load dashboard data.</p></div>`;
    console.error(e);
  }
}

// ═══════════════════════════════════════════════════════════
//  ADMIN PANEL
// ═══════════════════════════════════════════════════════════
async function renderAdmin(content, backBtn) {
  content.innerHTML = `${backBtn}<div class="spinner"></div>`;

  try {
    // Admin reads all users — requires .read: "auth != null" on /users
    const snap  = await db.ref('users').once('value');
    const users = snap.val() || {};

    const rows = Object.entries(users).map(([uid, u]) => {
      if (!u) return '';
      const actions  = u.actions || {};
      const badges   = ALL_ACTIONS
        .filter(a => actions[a.id])
        .map(a => `<span class="action-badge ab-${a.id}">${a.id}</span>`)
        .join('');

      const lastLogin = u.lastLogin
        ? new Date(u.lastLogin).toLocaleString('en-GB', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' })
        : '—';

      const adminBadge = u.isAdmin
        ? `<span class="action-badge" style="background:#fce4ec;color:#880e4f">admin</span>`
        : '';

      return `
        <tr>
          <td><strong>${u.userId || uid}</strong></td>
          <td>${u.displayName || '—'}</td>
          <td>
            <div class="action-badges">
              ${adminBadge}
              ${badges || '<span style="color:var(--slate);font-size:11px">None</span>'}
            </div>
          </td>
          <td style="font-size:12px;color:var(--slate)">${lastLogin}</td>
          <td>
            <button class="btn btn-ghost btn-sm" onclick="openEditUser('${uid}')">Edit</button>
            <button class="btn btn-danger btn-sm" style="margin-left:6px" onclick="deleteUser('${uid}','${u.userId||uid}')">Delete</button>
          </td>
        </tr>
      `;
    }).join('');

    content.innerHTML = `
      ${backBtn}
      <div class="panel-header">
        <div class="panel-title">⚙️ <span>Admin Panel</span></div>
        <button class="btn btn-primary" onclick="openCreateUser()">+ Create User</button>
      </div>

      <div class="card">
        <div class="card-header">👥 User Accounts (${Object.keys(users).length})</div>
        <div class="table-wrap">
          ${Object.keys(users).length > 0 ? `
            <table>
              <thead>
                <tr>
                  <th>User ID</th>
                  <th>Name</th>
                  <th>Permissions</th>
                  <th>Last Login</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody>${rows}</tbody>
            </table>
          ` : `
            <div class="empty-state">
              <div class="empty-icon">👤</div>
              <p>No users yet. Create the first one.</p>
            </div>
          `}
        </div>
      </div>
    `;
  } catch (e) {
    content.innerHTML = `${backBtn}<div class="empty-state"><div class="empty-icon">⚠️</div><p>Could not load users.</p></div>`;
  }
}

// ─── Modal: Create ───
function openCreateUser() {
  editingUid = null;
  document.getElementById('modal-title').textContent = 'Create User';
  document.getElementById('modal-uid').value  = '';
  document.getElementById('modal-uid').disabled = false;
  document.getElementById('modal-pwd').value  = '';
  document.getElementById('modal-name').value = '';
  document.getElementById('modal-pwd-group').style.display = 'block';
  renderActionsGrid({});
  document.getElementById('user-modal-overlay').classList.add('open');
  setTimeout(() => document.getElementById('modal-uid').focus(), 100);
}

// ─── Modal: Edit ───
async function openEditUser(uid) {
  editingUid = uid;
  document.getElementById('modal-title').textContent = 'Edit User';
  document.getElementById('modal-pwd-group').style.display = 'none'; // can't change pwd here

  try {
    const snap = await db.ref(`users/${uid}`).once('value');
    const u = snap.val() || {};
    document.getElementById('modal-uid').value  = u.userId || '';
    document.getElementById('modal-uid').disabled = true;
    document.getElementById('modal-name').value = u.displayName || '';
    renderActionsGrid(u.actions || {});
    document.getElementById('user-modal-overlay').classList.add('open');
  } catch (e) {
    showToast('Could not load user.', 'error');
  }
}

function closeUserModal() {
  document.getElementById('user-modal-overlay').classList.remove('open');
  editingUid = null;
}

// ─── Render action checkboxes ───
function renderActionsGrid(currentActions) {
  const grid = document.getElementById('actions-grid');
  grid.innerHTML = ALL_ACTIONS.map(a => {
    const checked = currentActions[a.id] ? 'checked' : '';
    return `
      <label class="action-check ${checked}" id="ac-${a.id}" onclick="toggleAction('${a.id}')">
        <input type="checkbox" ${checked}>
        <span class="check-dot"></span>
        ${a.label}
      </label>
    `;
  }).join('');
}

function toggleAction(id) {
  const el = document.getElementById(`ac-${id}`);
  el.classList.toggle('checked');
}

// ─── Save user ───
async function saveUser() {
  const btn      = document.getElementById('modal-save-btn');
  const rawId    = document.getElementById('modal-uid').value.trim().toUpperCase();
  const pwd      = document.getElementById('modal-pwd').value;
  const name     = document.getElementById('modal-name').value.trim();

  if (!rawId)  { showToast('User ID is required.', 'error'); return; }
  if (!name)   { showToast('Display name is required.', 'error'); return; }
  if (!editingUid && pwd.length < 6) {
    showToast('Password must be at least 6 characters.', 'error'); return;
  }

  // Collect checked actions
  const actions = {};
  ALL_ACTIONS.forEach(a => {
    if (document.getElementById(`ac-${a.id}`)?.classList.contains('checked')) {
      actions[a.id] = true;
    }
  });

  btn.disabled = true;
  btn.textContent = 'Saving…';

  try {
    if (editingUid) {
      // Edit existing: only update profile, not auth (can't change email/pwd from client without re-auth)
      await db.ref(`users/${editingUid}`).update({ displayName: name, actions });
      showToast('User updated.', 'success');
    } else {
      // Create new: create Firebase Auth user then write profile
      const email = rawId.toLowerCase() + EMAIL_DOMAIN;

      // Use a secondary app to create user without logging out admin
      const secondaryApp = firebase.initializeApp(firebaseConfig, 'secondary-' + Date.now());
      const secAuth = secondaryApp.auth();

      const cred = await secAuth.createUserWithEmailAndPassword(email, pwd);
      const newUid = cred.user.uid;
      await secAuth.signOut();
      await secondaryApp.delete();

      // Write profile to Realtime Database
      await db.ref(`users/${newUid}`).set({
        userId:      rawId,
        displayName: name,
        actions,
        isAdmin:     false,
        createdAt:   new Date().toISOString(),
        lastLogin:   null,
      });

      showToast(`User ${rawId} created.`, 'success');
    }

    closeUserModal();
    // Refresh admin panel
    openModule('admin');
  } catch (e) {
    console.error(e);
    const msg = e.code === 'auth/email-already-in-use'
      ? `User ID "${rawId}" already exists.`
      : 'Save failed: ' + (e.message || e.code);
    showToast(msg, 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Save User';
  }
}

// ─── Delete user ───
async function deleteUser(uid, userId) {
  if (!confirm(`Delete user "${userId}"?\n\nThis removes their profile and access. Their Firebase Auth account will remain (can be cleaned up in Firebase Console).`)) return;

  try {
    await db.ref(`users/${uid}`).remove();
    showToast(`User ${userId} removed.`, 'success');
    openModule('admin');
  } catch (e) {
    showToast('Delete failed.', 'error');
  }
}

// ═══════════════════════════════════════════════════════════
//  TOAST
// ═══════════════════════════════════════════════════════════
function showToast(msg, type = 'info') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className   = `toast ${type}`;
  t.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.style.display = 'none'; }, 3200);
}

// ═══════════════════════════════════════════════════════════
//  CLOSE MODAL ON OVERLAY CLICK
// ═══════════════════════════════════════════════════════════
document.getElementById('user-modal-overlay').addEventListener('click', function(e) {
  if (e.target === this) closeUserModal();
});

// ═══════════════════════════════════════════════════════════
//  FIRST-RUN: CREATE ADMIN ACCOUNT
//  If no users exist at all in the DB, show a setup screen
//  so the very first admin can be created.
//  This only runs once — remove after setup.
// ═══════════════════════════════════════════════════════════
async function checkFirstRun() {
  const snap = await db.ref('users').limitToFirst(1).once('value');
  if (!snap.exists()) {
    console.log('[PMS] No users found — first-run setup mode.');
    showFirstRunSetup();
  }
}
checkFirstRun();

function showFirstRunSetup() {
  // Only show if not already logged in
  if (currentUser) return;

  const loginCard = document.querySelector('.login-body');
  if (!loginCard) return;

  loginCard.insertAdjacentHTML('afterbegin', `
    <div style="background:#fff8e1;border:1px solid var(--gold);border-radius:10px;
      padding:12px 14px;margin-bottom:18px;font-size:12px;color:#5d4037;line-height:1.5">
      <strong>First-time setup detected.</strong><br>
      No user accounts exist yet.
      <a href="#" onclick="openFirstRunModal()" style="color:var(--dark-gold);font-weight:700;text-decoration:none">
        Create the Admin account →
      </a>
    </div>
  `);
}

function openFirstRunModal() {
  const uid  = prompt('Set Admin User ID (e.g. ADMIN01):');
  if (!uid) return;
  const name = prompt('Admin display name:');
  if (!name) return;
  const pwd  = prompt('Set password (min 6 characters):');
  if (!pwd || pwd.length < 6) { alert('Password too short.'); return; }

  const email = uid.toLowerCase() + EMAIL_DOMAIN;

  auth.createUserWithEmailAndPassword(email, pwd)
    .then(cred => {
      return db.ref(`users/${cred.user.uid}`).set({
        userId:      uid.toUpperCase(),
        displayName: name,
        actions:     { dashboard: true, plan: true, machine: true, material: true, approve: true, monitor: true, view: true },
        isAdmin:     true,
        createdAt:   new Date().toISOString(),
        lastLogin:   null,
      });
    })
    .then(() => {
      alert(`Admin account "${uid.toUpperCase()}" created. You are now logged in.`);
      location.reload();
    })
    .catch(e => alert('Setup failed: ' + e.message));
}
</script>
