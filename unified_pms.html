  `;
}

async function mpAddSetting(key) {
  if (key==='projects') {
    const name = document.getElementById('add-projects')?.value.trim();
    const code = document.getElementById('add-projects-code')?.value.trim();
    if (!name||!code) { showToast('Enter project name and code.','error'); return; }
    MP.settings.projects.push({name,code});
  } else if (key==='machines') {
    const name  = document.getElementById('add-machines-name')?.value.trim();
    const machId = document.getElementById('add-machines-id')?.value.trim();
    if (!name||!machId) { showToast('Enter machine name and ID.','error'); return; }
    const newM = {id:'m'+Date.now(), name, machId, status:'idle', job:'', prog:0};
    MP.settings.machines.push(newM);
    MP.machines.push(newM);
    await mpSaveMachine(newM);
  } else {
    const val = document.getElementById(`add-${key}`)?.value.trim();
    if (!val) { showToast('Enter a value.','error'); return; }
    if (!MP.settings[key]) MP.settings[key]=[];
    MP.settings[key].push(val);
  }
  await mpSaveSettings();
  showToast('Saved.','success');
  mpRenderTab();
}

async function mpRemoveSetting(key, idx) {
  if (!confirm('Remove this item?')) return;
  MP.settings[key].splice(idx,1);
  await mpSaveSettings();
  showToast('Removed.','success');
  mpRenderTab();
}

// ═══════════════════════════════════════════════════════════
//  RUN MODULE
// ═══════════════════════════════════════════════════════════
async function renderRun(content) {
  content.innerHTML = `<div class="spinner"></div>`;
  await mpLoadAll();
  MP.activeSession = null;
  MP.timerSec = 0;
  if (MP.timerInt) { clearInterval(MP.timerInt); MP.timerInt = null; }
  renderRunOrders(content);
}

function renderRunOrders(content) {
  const opName = currentProfile?.displayName || currentProfile?.userId || 'Operator';

  // Find orders with subs assigned to a machine for today
  const today = new Date().toISOString().slice(0,10);
  const myJobs = [];

  MP.orders.forEach(o => {
    if (o.status==='draft') return;
    (o.subs||[]).forEach(s => {
      if (s.planDate===today && s.status!=='complete' && s.status!=='pending-verify') {
        myJobs.push({s, o});
      }
    });
  });

  myJobs.sort((a,b)=>(a.s.seq||99)-(b.s.seq||99));

  // Check for paused session by this user
  const myPaused = MP.sessions.filter(s=>s.status==='paused'&&s.op===opName);

  let h = `
    <button class="btn-back" onclick="renderHome()">← Back to Home</button>
    <div class="panel-header">
      <div class="panel-title">🔧 <span>Run</span></div>
      <div style="font-size:13px;color:var(--slate)">Operator: <strong>${opName}</strong> · ${today}</div>
    </div>
  `;

  if (myPaused.length) {
    h += `<div class="al al-warn" style="margin-bottom:12px">⏸ ${myPaused.length} paused order${myPaused.length>1?'s':''} — see below to resume</div>`;
    myPaused.forEach(ps => {
      const o = MP.orders.find(x=>x.id===ps.moId);
      const s = (o?.subs||[]).find(x=>x.id===ps.soId);
      h += `
        <div class="run-job-card" style="border-color:var(--gold)">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <div>
              <div style="font-size:15px;font-weight:700">⏸ ${ps.item} ${mpStBadge('paused')}</div>
              <div style="font-size:12px;color:var(--slate)">${ps.cl} · ${ps.project}</div>
              <div style="font-size:12px;color:var(--slate)">Done this run: <strong>${ps.qty}</strong> · Rejected: <strong>${ps.rej||0}</strong></div>
            </div>
            <button class="btn btn-primary" onclick="mpResumeRun('${ps.id}',document.getElementById('app-content'))">▶ Resume</button>
          </div>
        </div>
      `;
    });
  }

  if (!myJobs.length && !myPaused.length) {
    h += `<div class="empty-state"><div class="empty-icon">📭</div><p>No orders assigned to you for today.<br>Contact the planner if you think this is wrong.</p></div>`;
  } else {
    myJobs.forEach(({s,o}) => {
      const isPaused    = MP.sessions.some(ps=>ps.soId===s.id&&ps.status==='paused');
      const isSubmitted = MP.sessions.some(ss=>ss.soId===s.id&&ss.status==='pending-verify');
      if (isPaused||isSubmitted) return;
      const pending = s.qty-(s.done||0)-(s.pendingDone||0)-(s.rej||0);
      const matLow  = (s.matQty||0) < s.qty;
      h += `
        <div class="run-job-card ${o.priority?'urgent':''}" onclick="mpStartRun('${o.id}','${s.id}',document.getElementById('app-content'))">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <div>
              <div style="font-size:15px;font-weight:700">${s.item} ${o.priority?'<span class="sbadge sb-urgent">🔥 Urgent</span>':''}</div>
              <div style="font-size:12px;color:var(--slate);margin-top:3px">${o.cl} · ${o.project}</div>
              <div style="font-size:12px;color:var(--slate)">Machine: <strong>${s.machine}</strong> · Seq: ${s.seq}</div>
              ${mpMatBadge(s)}
            </div>
            <div style="text-align:right">
              <div style="font-size:32px;font-weight:800;color:var(--info)">${pending}</div>
              <div style="font-size:11px;color:var(--slate)">pending</div>
            </div>
          </div>
        </div>
      `;
    });
  }

  content.innerHTML = h;
}

function mpStartRun(moId, soId, content) {
  const o  = MP.orders.find(x=>x.id===moId);
  const s  = (o?.subs||[]).find(x=>x.id===soId);
  const op = currentProfile?.displayName || currentProfile?.userId || 'Operator';

  MP.activeSession = {
    id: 'ms'+Date.now(),
    soId, moId, item: s.item, cl: o.cl, project: o.project,
    machType: s.machine, machId: s.machine,
    qty: 0, rej: 0,
    op, startEp: Date.now(), status: 'active',
    ts: mpTsLong(),
  };
  MP.timerSec = 0;
  renderRunActive(content);
}

function mpResumeRun(sessId, content) {
  const ps = MP.sessions.find(x=>x.id===sessId);
  if (!ps) return;
  MP.activeSession = {...ps};
  MP.timerSec = ps.elapsedSec || 0;
  renderRunActive(content);
}

function renderRunActive(content) {
  const sess = MP.activeSession;
  if (!sess) { renderRunOrders(content); return; }

  const o = MP.orders.find(x=>x.id===sess.moId);
  const s = (o?.subs||[]).find(x=>x.id===sess.soId);
  const pending = s ? Math.max(0,s.qty-(s.done||0)-(s.pendingDone||0)-(s.rej||0)) : '—';

  content.innerHTML = `
    <button class="btn-back" onclick="renderHome()">← Back to Home</button>

    <div class="card" style="margin-bottom:16px">
      <div class="card-header" style="display:flex;justify-content:space-between;align-items:center">
        <span>🔧 ${sess.item} — ${sess.cl}</span>
        ${mpStBadge('running')}
      </div>
      <div style="padding:16px">
        <div style="font-size:13px;color:var(--slate);margin-bottom:4px">${sess.project}</div>
        <div style="font-size:12px;color:var(--slate)">Machine: ${sess.machType} · Operator: ${sess.op}</div>
        <div style="font-size:12px;color:var(--slate)">Planned: ${s?.qty||'—'} · Approved Done: ${s?.done||0} · Still Pending: ${pending}</div>
      </div>
    </div>

    <div style="text-align:center;margin-bottom:8px">
      <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;color:var(--slate)">Session Timer</div>
      <div class="run-timer-display" id="run-timer">00:00:00</div>
    </div>

    <div class="run-counter">
      <div class="counter-box">
        <div class="counter-label">Completed</div>
        <div class="counter-val done" id="run-done">${sess.qty}</div>
        <div class="counter-btns">
          <button class="c-btn minus" onclick="mpAdj('qty',-1)">−</button>
          <button class="c-btn plus"  onclick="mpAdj('qty',1)">+</button>
        </div>
      </div>
      <div style="font-size:40px;color:var(--light-gold);font-weight:300">|</div>
      <div class="counter-box">
        <div class="counter-label">Rejected</div>
        <div class="counter-val rej" id="run-rej">${sess.rej}</div>
        <div class="counter-btns">
          <button class="c-btn minus" onclick="mpAdj('rej',-1)">−</button>
          <button class="c-btn plus"  onclick="mpAdj('rej',1)">+</button>
        </div>
      </div>
    </div>

    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px">
      <button class="btn btn-secondary" onclick="mpPauseRun(document.getElementById('app-content'))">⏸ Pause</button>
      <button class="btn btn-primary"   onclick="mpOpenSubmitRun(document.getElementById('app-content'))">📤 Submit for Verification</button>
      <button class="btn btn-danger"    onclick="mpStopRun(document.getElementById('app-content'))">⏹ Stop</button>
    </div>
  `;

  mpStartRunTimer();
}

function mpStartRunTimer() {
  if (MP.timerInt) clearInterval(MP.timerInt);
  MP.timerInt = setInterval(() => {
    MP.timerSec++;
    const h = Math.floor(MP.timerSec/3600);
    const m = Math.floor((MP.timerSec%3600)/60);
    const s = MP.timerSec%60;
    const el = document.getElementById('run-timer');
    if (el) el.textContent = `${mpPad(h)}:${mpPad(m)}:${mpPad(s)}`;
  }, 1000);
}

function mpAdj(field, delta) {
  if (!MP.activeSession) return;
  if (field==='qty') {
    MP.activeSession.qty = Math.max(0, MP.activeSession.qty+delta);
    const el = document.getElementById('run-done');
    if (el) el.textContent = MP.activeSession.qty;
  } else {
    MP.activeSession.rej = Math.max(0, MP.activeSession.rej+delta);
    const el = document.getElementById('run-rej');
    if (el) el.textContent = MP.activeSession.rej;
  }
}

async function mpPauseRun(content) {
  if (!MP.activeSession) return;
  clearInterval(MP.timerInt); MP.timerInt = null;
  MP.activeSession.elapsedSec = MP.timerSec;
  MP.activeSession.status = 'paused';
  await mpSaveSession(MP.activeSession);
  MP.sessions.push({...MP.activeSession});
  MP.activeSession = null;
  showToast('Order paused.','info');
  renderRunOrders(content);
}

async function mpStopRun(content) {
  if (!confirm('Stop order? Progress will be discarded.')) return;
  clearInterval(MP.timerInt); MP.timerInt = null;
  MP.activeSession = null;
  renderRunOrders(content);
}

function mpOpenSubmitRun(content) {
  const sess = MP.activeSession;
  if (!sess) return;

  document.getElementById('user-modal-overlay').classList.add('open');
  document.getElementById('modal-title').textContent = 'Submit for Verification';
  document.getElementById('modal-pwd-group').style.display = 'none';
  document.getElementById('actions-grid').style.display = 'none';
  document.querySelector('.modal-body').innerHTML = `
    <div class="metrics-row" style="grid-template-columns:repeat(2,1fr);margin-bottom:12px">
      <div class="metric-box"><div class="lbl">Completed</div><div class="val" style="color:var(--success)">${sess.qty}</div></div>
      <div class="metric-box"><div class="lbl">Rejected</div><div class="val" style="color:var(--danger)">${sess.rej}</div></div>
    </div>
    <div class="form-group">
      <label class="form-label">Notes for Planner (optional)</label>
      <textarea class="form-input" id="sub-notes" style="height:60px;resize:none" placeholder="Any remarks..."></textarea>
    </div>
  `;
  document.getElementById('modal-save-btn').textContent = 'Submit';
  document.getElementById('modal-save-btn').onclick = () => mpDoSubmitRun(content);
}

async function mpDoSubmitRun(content) {
  const sess = MP.activeSession;
  if (!sess) return;
  clearInterval(MP.timerInt); MP.timerInt = null;

  const notes = document.getElementById('sub-notes')?.value || '';
  const newSess = {
    ...sess,
    notes, ts: mpTsLong(),
    status: 'pending-verify',
    elapsedSec: MP.timerSec,
  };

  // Update sub-order pendingDone
  const o = MP.orders.find(x=>x.id===sess.moId);
  const s = (o?.subs||[]).find(x=>x.id===sess.soId);
  if (s) {
    s.pendingDone = (s.pendingDone||0) + sess.qty;
    if (s.status==='released'||s.status==='draft') s.status='partial';
  }
  mpCheckOrderStatus(sess.moId);

  await mpSaveSession(newSess);
  if (o) await mpSaveOrder(o);

  MP.sessions.push(newSess);
  MP.activeSession = null;
  closeUserModal();
  showToast('Submitted for verification.','success');
  await mpLoadAll();
  renderRunOrders(content);
}

// Reset modal body when closed (important since we reuse the user modal)
const origCloseUserModal = closeUserModal;
window.closeUserModal = function() {
  origCloseUserModal();
  // Restore modal body for user management if needed
  document.getElementById('actions-grid').style.display = '';
  document.getElementById('modal-pwd-group').style.display = '';
  document.getElementById('modal-save-btn').textContent = 'Save User';
  document.getElementById('modal-save-btn').onclick = saveUser;
};
let resetTargetUid = null;

function openPwdReset(uid, userId) {
  resetTargetUid = uid;
  document.getElementById('pwd-modal-userid').textContent = userId;
  document.getElementById('pwd-modal-new').value     = '';
  document.getElementById('pwd-modal-confirm').value = '';
  document.getElementById('pwd-modal-overlay').classList.add('open');
  setTimeout(() => document.getElementById('pwd-modal-new').focus(), 100);
}

function closePwdModal() {
  document.getElementById('pwd-modal-overlay').classList.remove('open');
  resetTargetUid = null;
}

async function savePwdReset() {
  const newPwd  = document.getElementById('pwd-modal-new').value;
  const confirm = document.getElementById('pwd-modal-confirm').value;
  const btn     = document.getElementById('pwd-save-btn');
  const userId  = document.getElementById('pwd-modal-userid').textContent;

  if (newPwd.length < 6)  { showToast('Password must be at least 6 characters.', 'error'); return; }
  if (newPwd !== confirm) { showToast('Passwords do not match.', 'error'); return; }
  if (!resetTargetUid)    { showToast('No user selected.', 'error'); return; }

  btn.disabled = true;
  btn.textContent = 'Resetting…';

  try {
    // Create a secondary Firebase app instance to change the password
    // without affecting the currently logged-in admin session
    const email = userId.toLowerCase() + EMAIL_DOMAIN;
    const secApp  = firebase.initializeApp(firebaseConfig, 'pwdreset-' + Date.now());
    const secAuth = secApp.auth();

    // We need to sign in as the user to call updatePassword.
    // Since admin doesn't know the old password, prompt for it once.
    const oldPwd = prompt(`Enter the CURRENT password for ${userId} to reset it:\n(Required by Firebase security policy)`);
    if (!oldPwd) {
      btn.disabled = false;
      btn.textContent = 'Reset Password';
      await secApp.delete();
      return;
    }

    const cred = await secAuth.signInWithEmailAndPassword(email, oldPwd);
    await cred.user.updatePassword(newPwd);
    await secAuth.signOut();
    await secApp.delete();

    // Log the reset in DB
    await db.ref(`users/${resetTargetUid}`).update({
      passwordResetAt: new Date().toISOString(),
      passwordResetBy: currentProfile?.userId || 'admin',
    });

    showToast(`Password for ${userId} reset successfully.`, 'success');
    closePwdModal();
  } catch(e) {
    const msg = e.code === 'auth/wrong-password' || e.code === 'auth/invalid-credential'
      ? 'Current password incorrect.'
      : 'Reset failed: ' + (e.message || e.code);
    showToast(msg, 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Reset Password';
  }
}

document.getElementById('pwd-modal-overlay').addEventListener('click', function(e) {
  if (e.target === this) closePwdModal();
});

// ═══════════════════════════════════════════════════════════
//  CLOSE MODAL ON OVERLAY CLICK

document.getElementById('user-modal-overlay').addEventListener('click', function(e) {

});

//  FIRST-RUN: CREATE ADMIN ACCOUNT
//  If no users exist at all in the DB, show a setup screen
//  so the very first admin can be created.
//  This only runs once — remove after setup.
// ═══════════════════════════════════════════════════════════
async function checkFirstRun() {
  const snap = await db.ref('users').limitToFirst(1).once('value');
  if (!snap.exists()) {
    console.log('[PMS] No users found — first-run setup mode.');
    showFirstRunSetup();
  }
}
checkFirstRun();

function showFirstRunSetup() {
  // Only show if not already logged in
  if (currentUser) return;

  const loginCard = document.querySelector('.login-body');
  if (!loginCard) return;

  loginCard.insertAdjacentHTML('afterbegin', `
    <div style="background:#fff8e1;border:1px solid var(--gold);border-radius:10px;
      padding:12px 14px;margin-bottom:18px;font-size:12px;color:#5d4037;line-height:1.5">
      <strong>First-time setup detected.</strong><br>
      No user accounts exist yet.
      <a href="#" onclick="openFirstRunModal()" style="color:var(--dark-gold);font-weight:700;text-decoration:none">
        Create the Admin account →
      </a>
    </div>
  `);
}

function openFirstRunModal() {
  const uid  = prompt('Set Admin User ID (e.g. ADMIN01):');
  if (!uid) return;
  const name = prompt('Admin display name:');
  if (!name) return;
  const pwd  = prompt('Set password (min 6 characters):');
  if (!pwd || pwd.length < 6) { alert('Password too short.'); return; }

  const email = uid.toLowerCase() + EMAIL_DOMAIN;

  auth.createUserWithEmailAndPassword(email, pwd)
    .then(cred => {
      return db.ref(`users/${cred.user.uid}`).set({
        userId:      uid.toUpperCase(),
        displayName: name,
        actions:     { dashboard: true, plan: true, machine: true, material: true, approve: true, monitor: true, view: true },
        isAdmin:     true,
        createdAt:   new Date().toISOString(),
        lastLogin:   null,
      });
    })
    .then(() => {
      alert(`Admin account "${uid.toUpperCase()}" created. You are now logged in.`);
      location.reload();
    })
    .catch(e => alert('Setup failed: ' + e.message));
}
